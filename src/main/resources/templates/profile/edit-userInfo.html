<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Member Sidebar -->
    <div sec:authorize="hasRole('MEMBER')" th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Member Sidebar -->
    <div sec:authorize="hasRole('ADMIN')" th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Trainer Sidebar -->
    <div sec:authorize="hasRole('TRAINER')" th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">

                            <h4 class="mb-3 text-center">Update Profile</h4>
                            <hr>

                            <form th:action="@{/profile/update-user-info}"
                                  method="post">

                                <!-- First Name -->
                                <div class="mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text"
                                           name="firstName"
                                           class="form-control"
                                           th:value="${user.firstName}"
                                           required>
                                </div>

                                <!-- Last Name -->
                                <div class="mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text"
                                           name="lastName"
                                           class="form-control"
                                           th:value="${user.lastName}"
                                           required>
                                </div>

                                <!-- Phone -->
                                <div class="mb-3">
                                    <label class="form-label">Phone</label>
                                    <input type="text"
                                           name="phone"
                                           class="form-control"
                                           th:value="${user.phone}">
                                </div>

                                <!-- Gender -->
                                <div class="mb-3">
                                    <label class="form-label">Gender</label>
                                    <select name="gender"
                                            class="form-select">
                                        <option value="" disabled>Select Gender</option>
                                        <option value="Male"
                                                th:selected="${user.gender == 'Male'}">
                                            Male
                                        </option>
                                        <option value="Female"
                                                th:selected="${user.gender == 'Female'}">
                                            Female
                                        </option>
                                        <option value="Other"
                                                th:selected="${user.gender == 'Other'}">
                                            Other
                                        </option>
                                    </select>
                                </div>

                                <!-- Address -->
                                <div class="mb-3">
                                    <label class="form-label">Address</label>
                                    <textarea name="address"
                                              class="form-control"
                                              rows="3"
                                              th:text="${user.address}">
                            </textarea>
                                </div>

                                <!-- Email (Readonly) -->
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email"
                                           class="form-control"
                                           th:value="${user.email}"
                                           readonly>
                                </div>

                                <div class="d-grid mt-4">
                                    <button type="submit"
                                            class="btn btn-primary btn-lg">
                                        Update Profile
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </main>


</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
