<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Member Sidebar -->
    <div sec:authorize="hasRole('MEMBER')" th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Member Sidebar -->
    <div sec:authorize="hasRole('ADMIN')" th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Trainer Sidebar -->
    <div sec:authorize="hasRole('TRAINER')" th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-5">

            <div class="row justify-content-center">
                <div th:if="${message}" class="alert alert-success">
                    <i class="ri-checkbox-circle-line"></i>
                    <span th:text="${message}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger">
                    <i class="ri-error-warning-line"></i>
                    <span th:text="${error}"></span>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <div class="position-relative d-inline-block text-center">

                                <!-- Profile Image -->
                                <img th:if="${user.profileImage != null}"
                                     th:src="@{'/uploads/profile/' + ${user.profileImage}}"
                                     alt="Profile Image"
                                     class="rounded-circle shadow"
                                     style="width:150px;
                                            height:150px;
                                            object-fit:cover;
                                            object-position:center;
                                            display:block;
                                            margin:auto;"
                                     onerror="this.src='/images/default.png'">

                                <!-- Default Icon -->
                                <div th:if="${user.profileImage == null}"
                                     class="rounded-circle d-flex align-items-center justify-content-center bg-light shadow"
                                     style="width:150px;height:150px;font-size:60px;margin:auto;">
                                    <i class="ri-user-3-line text-secondary"></i>
                                </div>

                                <!-- Camera Button -->
                                <a th:href="@{/profile/update-photo}"
                                   class="position-absolute bottom-0 end-0 bg-white rounded-circle p-2 shadow-sm border">
                                    <i class="ri-camera-line"></i>
                                </a>

                            </div>


                            <!-- Name -->
                            <h3 class="card-title mb-2"
                                th:text="${user.firstName + ' ' + user.lastName}">
                            </h3>

                            <!-- Role Badge -->
                            <span class="badge bg-primary mb-3"
                                  th:text="${#strings.replace(user.role,'ROLE_','')}">
                        </span>

                            <hr>

                            <!-- User Details -->
                            <div class="text-start">
                                <p><strong>Email:</strong>
                                    <span th:text="${user.email}"></span>
                                </p>

                                <p><strong>Phone:</strong>
                                    <span th:text="${user.phone}"></span>
                                </p>

                                <p><strong>Gender:</strong>
                                    <span th:text="${user.gender}"></span>
                                </p>

                                <p><strong>Address:</strong>
                                    <span th:text="${user.address}"></span>
                                </p>

                                <p><strong>Active:</strong>
                                    <span th:text="${user.active ? 'Yes' : 'No'}"></span>
                                </p>
                            </div>

                            <div class="mt-4">
                                <div class="d-grid gap-2">

                                    <!-- Update Basic Info -->
                                    <a th:href="@{/profile/update-user-info}"
                                       class="btn btn-outline-primary">
                                        <i class="ri-edit-line me-1"></i>
                                        Update Profile Info
                                    </a>

                                    <!-- Change Password -->
                                    <a th:href="@{/profile/change-password}"
                                       class="btn btn-outline-warning">
                                        <i class="ri-lock-password-line me-1"></i>
                                        Change Password
                                    </a>

                                    <!-- Logout -->
                                    <form id="logoutForm"
                                          th:action="@{/logout}"
                                          method="post"
                                          class="w-100">  <!-- ✅ important -->

                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}" />

                                        <button type="button"
                                                onclick="confirmLogout()"
                                                class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2">

                                            <i class="ri-logout-box-r-line"></i>
                                            Logout

                                        </button>
                                    </form>

                                </div>

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
