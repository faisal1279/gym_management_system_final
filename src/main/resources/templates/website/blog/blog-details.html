<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/common-hero-section.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <title th:text="${blog.title}">Blog Details</title>

    <style>
        .blog-details { max-width: 1200px; }

        .blog-title {
            font-weight: 900;
            font-size: 46px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .blog-meta {
            color: #777;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .blog-main-img img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .blog-paragraph p {
            font-size: 18px;
            line-height: 1.9;
            color: #444;
            margin-bottom: 18px;
        }
        .blog-meta {
            color: #6b7280;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .blog-main-img img {
            width: 100%;
            border-radius: 12px;
            margin: 20px 0;
        }

        .blog-image-card {
            overflow: hidden;
            border-radius: 12px;
        }

        .blog-image-card img {
            transition: 0.4s ease;
        }

        .blog-image-card:hover img {
            transform: scale(1.07);
        }
        .blog-paragraph p {
            font-size: 18px;
            line-height: 1.9;
            color: #374151;
            margin-bottom: 20px;
        }

        .blog-image-card { overflow: hidden; border-radius: 10px; }

        .blog-image-card img { transition: 0.4s; }

        .blog-image-card:hover img { transform: scale(1.05); }
        .blog-details {
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media(max-width:768px){
            .blog-title{
                font-size: 28px;
            }
            .blog-paragraph p{
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Hero -->
<div th:replace="~{fragments/hero-section :: hero(
        'Blog Details',
        'Read our latest insights and updates.',
        @{/images/hero/bg-page2.webp}
)}"></div>

<div class="container-fluid px-lg-5">
    <div class="row justify-content-center">

        <div class="col-xl-8 col-lg-10">

            <div class="blog-details py-5">

            <!-- Title -->
            <h1 class="blog-title mb-3" th:text="${blog.title}"></h1>

            <!-- Meta -->
            <div class="blog-meta mb-4">
                <span class="me-4">
                    <i class="ri-price-tag-3-line"></i>
                    <span th:text="${blog.category}"></span>
                </span>
                <span class="me-4">
                    <i class="ri-user-line"></i>
                    <span th:text="${blog.author.lastName}"></span>
                </span>
                <span>
                    <i class="ri-calendar-line"></i>
                    <span th:text="${#temporals.format(blog.createdAt,'dd MMM yyyy')}"></span>
                </span>
            </div>

            <!-- Main Image: Cover or First Image -->
            <div class="blog-main-img mb-4" th:if="${blog.coverImage != null}">
                <img th:src="@{'/uploads/blog/' + ${blog.coverImage}}" alt="Cover Image">
            </div>

            <div class="blog-main-img mb-4" th:if="${blog.coverImage == null and blog.images.size() > 0}">
                <img th:src="@{'/uploads/blog/' + ${blog.images[0].imageUrl}}" alt="First Blog Image">
            </div>

            <!-- First 2 paragraphs -->
            <div th:each="p, stat : ${paragraphs}" th:if="${stat.index < 2}" class="blog-paragraph">
                <p th:utext="${p}"></p>
            </div>

            <!-- Remaining images (skip first if used as main) -->
            <div class="row g-3 my-4" th:if="${blog.images.size() > 0}">
                <div class="col-md-6" th:each="img, stat : ${blog.images}"
                     th:if="${!(stat.index == 0 and blog.coverImage == null)}">
                    <div class="blog-image-card">
                        <img th:src="@{'/uploads/blog/' + ${img.imageUrl}}" class="img-fluid rounded">
                    </div>
                </div>
            </div>

            <!-- Remaining paragraphs -->
            <div th:each="p, stat : ${paragraphs}" th:if="${stat.index >= 2}" class="blog-paragraph">
                <p th:utext="${p}"></p>
            </div>

            <!-- Back to list button -->
            <div class="mt-4">
                <a th:href="@{/blogs}" class="btn btn-secondary">
                    <i class="ri-arrow-left-line"></i> Back to Blog List
                </a>
            </div>

        </div>
    </div>
</div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
