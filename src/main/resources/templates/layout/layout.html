<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<!-- ===================== -->
<!-- Common Head Fragment -->
<!-- ===================== -->
<head th:fragment="head(title)">

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Gym Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
          rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

</head>

<!-- ===================== -->
<!-- Common Layout -->
<!-- ===================== -->

<div th:fragment="layout(content)">

    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="dashboard-wrapper">

        <!-- ADMIN -->
        <div sec:authorize="hasRole('ADMIN')"
             th:replace="fragments/admin-sidebar :: sidebar">
        </div>

        <!-- MEMBER -->
        <div sec:authorize="hasRole('MEMBER')"
             th:replace="fragments/member-sidebar :: memberSidebar">
        </div>

        <!-- TRAINER -->
        <div sec:authorize="hasRole('TRAINER')"
             th:replace="fragments/trainer-sidebar :: trainerSidebar">
        </div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="content"
                 th:replace="${content}">
            </div>

        </main>

    </div>

    <!-- Common JS -->
    <script th:src="@{/js/navbar.js}"></script>
    <script th:src="@{/js/logout.js}"></script>

</div>

</body>
</html>
