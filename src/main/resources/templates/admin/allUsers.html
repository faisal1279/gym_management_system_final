<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/pagination.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>User List</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${error}" class="alert alert-danger">
                <i class="ri-error-warning-line"></i>
                <span th:text="${error}"></span>
            </div>

<!--            ===============  pop up profile=====================-->
            <div class="modal fade" id="userModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content p-4">

                        <div class="text-center">
                            <img id="modalImage"
                                 class="rounded-circle mb-3"
                                 style="width:100px; height:100px; object-fit:cover;">
                            <h5 id="modalName"></h5>
                            <p id="modalRole" class="text-muted"></p>
                            <p id="modalEmail"></p>
                            <p id="modalPhone"></p>
                        </div>

                    </div>
                </div>
            </div>
<!--            ==============================================-->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

                <!-- Left -->
                <div>
                    <h2 class="fw-bold mb-0">User Management</h2>
                    <small class="text-muted">
                        Manage all users, roles and permissions
                    </small>
                </div>
            </div>
            <div class="table-responsive">
                <!-- ================= SEARCH & FILTER ================= -->
                <div class="card  mb-4" style="background: transparent">
                    <div class="card-body">
                        <form method="get" th:action="@{/admin/users}">

                            <div class="row g-3 align-items-center">

                                <!-- Search -->
                                <div class="col-md-5">
                                    <input type="text"
                                           name="keyword"
                                           class="form-control"
                                           placeholder="Search by name, email or phone..."
                                           th:value="${keyword}">
                                </div>

                                <!-- Role Filter -->
                                <div class="col-md-3">
                                    <select name="role" class="form-select">
                                        <option value="">All Roles</option>
                                        <option value="ROLE_ADMIN"
                                                th:selected="${role == 'ROLE_ADMIN'}">Admin</option>
                                        <option value="ROLE_TRAINER"
                                                th:selected="${role == 'ROLE_TRAINER'}">Trainer</option>
                                        <option value="ROLE_MEMBER"
                                                th:selected="${role == 'ROLE_MEMBER'}">Member</option>
                                        <option value="ROLE_USER"
                                                th:selected="${role == 'ROLE_USER'}">User</option>
                                    </select>
                                </div>

                                <!-- Search Button -->
                                <div class="col-md-2">
                                    <button type="submit" class="btn-in w-100">
                                        <i class="ri-search-line me-1"></i> Search
                                    </button>
                                </div>

                                <!-- Reset -->
                                <div class="col-md-2">
                                    <a th:href="@{/admin/users}" class="btn btn-in w-100">
                                        Reset
                                    </a>
                                </div>

                            </div>

                        </form>
                    </div>
                </div>
                <table class="table align-middle admin-table">
                    <thead class="table-dark">
                    <tr>
                        <th>User</th>
                        <th class="d-none d-md-table-cell">Email</th>
                        <th>Phone</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">

                        <!-- USER INFO -->
                        <td>
                            <div class="d-flex align-items-center gap-3">

                                <!-- Avatar -->
                                <div class="avatar-wrapper"
                                     data-bs-toggle="modal"
                                     data-bs-target="#userModal"
                                     th:attr="data-name=${user.firstName + ' ' + user.lastName},
                                  data-email=${user.email},
                                  data-phone=${user.phone},
                                  data-role=${user.role},
                                  data-img=${user.profileImage}">

                                    <!-- Image -->
                                    <img th:if="${user.profileImage != null}"
                                         th:src="@{'/uploads/profile/' + ${user.profileImage}}"
                                         class="avatar-img">

                                    <!-- Default Icon -->
                                    <div th:if="${user.profileImage == null}"
                                         class="default-avatar">
                                        <i class="ri-user-3-fill"></i>
                                    </div>

                                    <!-- Online Dot -->
                                    <span class="online-dot"></span>
                                </div>

                                <!-- Name -->
                                <div>
                                    <div class="fw-semibold"
                                         th:text="${user.firstName + ' ' + user.lastName}"></div>
                                    <small class="text-muted"
                                           th:text="${user.role}"></small>
                                </div>

                            </div>
                        </td>

                        <td class="d-none d-md-table-cell"
                            th:text="${user.email}"></td>

                        <td th:text="${user.phone}"></td>
                        <!-- Action -->
                        <td class="text-nowrap">
                            <a th:if="${user.role == 'ROLE_USER'}"
                               th:href="@{'/admin/users/' + ${user.id} + '/make-trainer'}"
                               class="btn btn-sm btn-success">
                                Make Trainer
                            </a>

                            <a th:if="${user.role == 'ROLE_USER'}"
                               th:href="@{'/admin/users/' + ${user.id} + '/make-member'}"
                               class="btn btn-sm btn-secondary">
                                Make Member
                            </a>
                        </td>

                    </tr>
                    <tr th:if="${users.size() == 0}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="ri-user-search-line fs-2"></i>
                            <div>No users found</div>
                        </td>
                    </tr>
                    </tbody>
                </table>



<!--                pagination section-->
                <div th:if="${totalPages > 1}">
                    <div th:replace="fragments/pagination :: pagination('/admin/users', ${currentPage}, ${totalPages})"></div>
                </div>
            </div>
        </div>
    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        var userModal = document.getElementById('userModal');

        userModal.addEventListener('show.bs.modal', function (event) {

            var button = event.relatedTarget;

            if (!button) return;

            document.getElementById('modalName').textContent =
                button.getAttribute('data-name') || '';

            document.getElementById('modalEmail').textContent =
                button.getAttribute('data-email') || '';

            document.getElementById('modalPhone').textContent =
                button.getAttribute('data-phone') || '';

            document.getElementById('modalRole').textContent =
                button.getAttribute('data-role') || '';

            var img = button.getAttribute('data-img');

            if (img && img !== "null") {
                document.getElementById('modalImage').src = "/uploads/profile/" + img;
            } else {
                document.getElementById('modalImage').src = "/uploads/profile/default.png";
            }
        });

    });
</script>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
