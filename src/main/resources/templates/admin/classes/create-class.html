<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Class</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <style>
        /*.form-control{*/
        /*    border-radius:0;*/
        /*    padding:12px;*/
        /*}*/

        .create-btn{
            width:100%;
            background:#111;
            color:#fff;
            padding:12px;
            border:none;
            font-weight:600;
        }

        .create-btn:hover{
            background:#00b894;
        }

        .schedule-card{
            border:1px dashed #ccc;
            padding:15px;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main -->
    <main class="main-content">
        <div class="container py-5">

            <h2 class="mb-4">Create Gym Class</h2>

            <!-- ALERT -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/admin/classes/create}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Name -->
                <div class="mb-3">
                    <label>Class Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <!-- Level -->
                <div class="mb-3">
                    <label>Level</label>
                    <select name="level" class="form-control">
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>

                <!-- Duration -->
                <div class="mb-3">
                    <label>Duration (minutes)</label>
                    <input type="number" name="duration" class="form-control">
                </div>

                <!-- Capacity -->
                <div class="mb-3">
                    <label>Capacity</label>
                    <input type="number" name="capacity" class="form-control">
                </div>

                <!-- Trainer -->
                <div class="mb-3">
                    <label>Assign Trainer</label>
                    <select name="trainerId" class="form-control">
                        <option value="">Select Trainer</option>
                        <option th:each="t : ${trainers}"
                                th:value="${t.trainerId}"
                                th:text="${t.user.firstName + ' ' + t.user.lastName}">
                        </option>
                    </select>
                </div>

<!--&lt;!&ndash;                 Cover Image&ndash;&gt;-->
                <div class="mb-3">
                    <label>Cover Image</label>
                    <input type="file" name="coverImage" class="form-control"
                           onchange="previewCover(event)">

                    <img id="coverPreview"
                         style="max-width:200px;margin-top:10px;display:none;">
                </div>

                <!-- Multiple Images -->
                <div class="mb-3">
                    <label>Class Images</label>
                    <input type="file" name="images" multiple  class="form-control"
                           onchange="previewImages(event)">

                    <div id="imagePreview" class="d-flex gap-2 mt-2"></div>
                </div>

                <!-- Short Desc -->
                <div class="mb-3">
                    <label>Short Description</label>
                    <textarea name="shortDesc" class="form-control"></textarea>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label>Full Description</label>
                    <textarea name="description" class="form-control"></textarea>
                </div>

                <!-- Schedule Section -->
                <h5 class="mt-4 mb-2">Class Schedule</h5>

<!--                <div id="scheduleContainer">-->

<!--                    <div class="schedule-card">-->

<!--                        <select name="days" class="form-control mb-2">-->
<!--                            <option>MONDAY</option>-->
<!--                            <option>TUESDAY</option>-->
<!--                            <option>WEDNESDAY</option>-->
<!--                            <option>THURSDAY</option>-->
<!--                            <option>FRIDAY</option>-->
<!--                            <option>SATURDAY</option>-->
<!--                            <option>SUNDAY</option>-->
<!--                        </select>-->

<!--                        <input type="time" name="startTimes" class="form-control mb-2">-->
<!--                        <input type="time" name="endTimes" class="form-control">-->

<!--                    </div>-->

<!--                </div>-->

<!--                <button type="button" class="btn btn-outline-dark mb-3"-->
<!--                        onclick="addSchedule()">-->
<!--                    + Add More Schedule-->
<!--                </button>-->

                <!-- Active -->
                <div class="form-check mb-3">
                    <input type="checkbox" name="active" class="form-check-input">
                    <label class="form-check-label">Active</label>
                </div>

                <button class="create-btn">Create Class</button>

            </form>

        </div>
    </main>
</div>

<script>
    function previewCover(event){
        const img = document.getElementById("coverPreview");
        img.src = URL.createObjectURL(event.target.files[0]);
        img.style.display = "block";
    }

    function previewImages(event){
        const container = document.getElementById("imagePreview");
        container.innerHTML = "";

        for(let file of event.target.files){
            let img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            img.style.width = "100px";
            container.appendChild(img);
        }
    }

    function addSchedule(){
        const container = document.getElementById("scheduleContainer");

        const html = `
        <div class="schedule-card">
            <select name="days" class="form-control mb-2">
                <option>MONDAY</option>
                <option>TUESDAY</option>
                <option>WEDNESDAY</option>
                <option>THURSDAY</option>
                <option>FRIDAY</option>
                <option>SATURDAY</option>
                <option>SUNDAY</option>
            </select>

            <input type="time" name="startTimes" class="form-control mb-2">
            <input type="time" name="endTimes" class="form-control">
        </div>
    `;

        container.insertAdjacentHTML('beforeend', html);
    }
</script>

</body>
</html>
