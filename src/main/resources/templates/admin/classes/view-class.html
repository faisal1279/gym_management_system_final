<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>View Class</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <main class="main-content">
        <div class="container py-5">

            <h2 th:text="${gymClass.name}"></h2>

            <div class="mb-3">
                <strong>Level:</strong> <span th:text="${gymClass.level}"></span>
            </div>

            <div class="mb-3">
                <strong>Duration:</strong> <span th:text="${gymClass.duration}"></span> minutes
            </div>

            <div class="mb-3">
                <strong>Capacity:</strong> <span th:text="${gymClass.capacity}"></span>
            </div>

            <div class="mb-3">
                <strong>Trainer:</strong> <span th:text="${gymClass.trainer.user.firstName + ' ' + gymClass.trainer.user.lastName}"></span>
            </div>

            <div class="mb-3">
                <strong>Cover Image:</strong><br>
                <img th:if="${gymClass.coverImage!=null}" th:src="@{'/uploads/classes/' + ${gymClass.coverImage}}" class="img-fluid" style="max-width:300px;">
            </div>

            <div class="mb-3">
                <strong>Images:</strong><br>
                <img th:each="img : ${gymClass.images}" th:src="@{'/uploads/classes/' + ${img.imageUrl}}" style="width:120px;margin-right:5px;">
            </div>

            <div class="mb-3">
                <strong>Short Description:</strong>
                <p th:text="${gymClass.shortDescription}"></p>
            </div>

            <div class="mb-3">
                <strong>Description:</strong>
                <p th:utext="${gymClass.description}"></p>
            </div>

            <div class="mb-3">
                <strong>Schedule:</strong>
                <ul>
                    <li th:each="s : ${gymClass.schedules}"
                        th:text="${s.day + ' : ' + s.startTime + ' - ' + s.endTime}"></li>
                </ul>
            </div>

            <div class="mb-3">
                <strong>Status:</strong>
                <span th:text="${gymClass.active ? 'Active' : 'Inactive'}"></span>
            </div>

            <a th:href="@{/admin/class}" class="btn btn-dark mt-3">Back to List</a>

        </div>
    </main>
</div>

</body>
</html>
