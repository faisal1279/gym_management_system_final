<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Class Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main -->
    <main class="main-content">
        <div class="container mt-4">

            <!-- 🔥 Alert -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="fw-bold">Gym Classes</h4>

                <a th:href="@{/admin/classes/create}"
                   class="btn btn-dark">

                    <i class="ri-add-line"></i> Create Class
                </a>

            </div>

            <!-- Table -->
            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Level</th>
                                <th>Duration</th>
                                <th>Capacity</th>
                                <th>Trainer</th>
                                <th>Schedule</th>
                                <th>Status</th>
                                <th class="text-center">Action</th>
                            </tr>
                            </thead>

                            <tbody>

                            <!-- LOOP -->
                            <tr th:each="c : ${classes}">

                                <!-- Cover Image -->
                                <td>
                                    <img th:if="${c.coverImage != null}"
                                         th:src="@{'/uploads/classes/' + ${c.coverImage}}"
                                         width="70"
                                         class="rounded shadow-sm">

                                    <div th:if="${c.coverImage == null}"
                                         class="text-muted small">
                                        No Image
                                    </div>
                                </td>

                                <!-- Name -->
                                <td class="fw-semibold"
                                    th:text="${c.name}">
                                </td>

                                <!-- Level -->
                                <td>
                                    <span class="badge bg-primary"
                                          th:text="${c.level}">
                                    </span>
                                </td>

                                <!-- Duration -->
                                <td>
                                    <span th:text="${c.duration}"></span> min
                                </td>

                                <!-- Capacity -->
                                <td th:text="${c.capacity}"></td>

                                <!-- Trainer -->
                                <td>
                                    <span th:if="${c.trainer != null}"
                                          th:text="${c.trainer.user.firstName}">
                                    </span>

                                    <span th:if="${c.trainer == null}"
                                          class="text-muted small">
                                        Not Assigned
                                    </span>
                                </td>

                                <!-- Schedule -->
                                <td>
                                    <div th:each="s : ${c.schedules}"
                                         class="small">

                                        <b th:text="${s.day}"></b> :
                                        <span th:text="${s.startTime}"></span>
                                        -
                                        <span th:text="${s.endTime}"></span>

                                    </div>
                                </td>

                                <!-- Status -->
                                <td>
                                    <span th:if="${c.active}"
                                          class="badge bg-success">
                                        Active
                                    </span>

                                    <span th:if="${!c.active}"
                                          class="badge bg-danger">
                                        Inactive
                                    </span>
                                </td>

                                <!-- Actions -->
                                <td class="text-center">

                                    <a th:href="@{/admin/classes/view/{id}(id=${c.id})}"
                                       class="btn btn-sm btn-info">

                                        <i class="ri-eye-line"></i>
                                    </a>

                                    <a th:href="@{/admin/classes/edit/{id}(id=${c.id})}"
                                       class="btn btn-sm btn-warning">

                                        <i class="ri-edit-line"></i>
                                    </a>

                                    <a th:href="@{/admin/classes/delete/{id}(id=${c.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this class?')">

                                        <i class="ri-delete-bin-line"></i>
                                    </a>

                                </td>

                            </tr>

                            <!-- Empty -->
                            <tr th:if="${classes.size() == 0}">
                                <td colspan="9" class="text-center text-muted py-4">
                                    No classes found
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
