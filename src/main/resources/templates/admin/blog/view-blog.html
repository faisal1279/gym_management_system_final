<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title th:text="${blog.title}">View Blog</title>

    <style>
        .cover-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .blog-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>
<!--    <div th:replace="fragments/sidebar :: sidebar"></div>-->
    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container py-5">

                <!-- Back Button -->
                <div class="mb-3">
                    <a th:href="@{/admin/blogs}" class="btn btn-secondary">
                        <i class="ri-arrow-left-line"></i> Back to Blog List
                    </a>
                </div>

                <!-- Blog Title -->
                <h2 class="fw-bold mb-2" th:text="${blog.title}"></h2>

                <!-- Category, Author, Date -->
                <p class="text-muted mb-4">
                    <i class="ri-price-tag-3-line me-1"></i>
                    Category: <span th:text="${blog.category}"></span> |
                    <i class="ri-user-line ms-2 me-1"></i>
                    Author: <span th:text="${blog.author.lastName}"></span> |
                    <i class="ri-calendar-line ms-2 me-1"></i>
                    <span th:text="${blog.createdAt != null ? #temporals.format(blog.createdAt,'dd MMM yyyy') : 'N/A'}"></span>
                </p>

                <!-- Cover Image -->
                <div th:if="${blog.coverImage != null}">
                    <img th:src="@{'/uploads/blog/' + ${blog.coverImage}}"
                         class="cover-img shadow mb-4">
                </div>

                <hr>

                <!-- Additional Images -->
                <div class="row g-3 mb-4" th:if="${blog.images.size() > 0}">
                    <div class="col-md-4 col-6" th:each="img : ${blog.images}">
                        <img th:src="@{'/uploads/blog/' + ${img.imageUrl}}"
                             class="img-fluid blog-image shadow">
                    </div>
                </div>

                <hr>

                <!-- Blog Content -->
                <div class="fs-5" th:utext="${blog.content}"></div>

            </div>
        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
