<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${message}" class="alert alert-success">
                <i class="ri-checkbox-circle-line"></i>
                <span th:text="${message}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <i class="ri-error-warning-line"></i>
                <span th:text="${error}"></span>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">

                            <h4 class="mb-4 text-center">Create Trainer</h4>

<!--                            <form th:action="@{'/admin/users/' + ${user.id} + '/make-trainer'}"-->

<!--                                           name="experienceYears"-->

<!--                                           required>-->

<!--                                           name="salary"-->
<!--                                           class="form-control"-->
<!--                                           min="0"-->
<!--                                           placeholder="e.g. 25000"-->
<!--                                           required>-->
<!--                                </div>-->

<!--                                <div class="d-grid mt-4">-->
<!--                                    <button class="btn btn-primary btn-lg">-->
<!--                                        Create Trainer-->
<!--                                    </button>-->
<!--                                </div>-->

<!--                            </form>-->
                            <form th:action="@{'/admin/users/' + ${user.id} + '/make-trainer'}"
                                  method="post">

                                <!-- Specialization -->
                                <div class="mb-3">
                                    <label class="form-label">Specialization</label>
                                    <input type="text"
                                           name="specialization"
                                           class="form-control"
                                           placeholder="e.g. Fitness, Yoga, Cardio"
                                           required>
                                </div>

                                <!-- Experience -->
                                <div class="mb-3">
                                    <label class="form-label">Experience (Years)</label>
                                    <input type="number"
                                           name="experienceYears"
                                           class="form-control"
                                           min="0"
                                           placeholder="e.g. 3"
                                           required>
                                </div>

                                <!-- Salary -->
                                <div class="mb-3">
                                    <label class="form-label">Salary</label>
                                    <input type="number"
                                           name="salary"
                                           class="form-control"
                                           min="0"
                                           placeholder="e.g. 25000"
                                           required>
                                </div>

                                <!-- Bio -->
                                <div class="mb-3">
                                    <label class="form-label">Bio</label>
                                    <textarea name="bio"
                                              class="form-control"
                                              rows="4"
                                              placeholder="Write trainer bio..."></textarea>
                                </div>

                                <!-- 🔥 Skills -->
                                <div class="mb-3">
                                    <label class="form-label">Skills</label>

<!--                                    <div id="skillContainer">-->
<!--                                        <input type="text"-->
<!--                                               name="skills"-->
<!--                                               class="form-control mb-2"-->
<!--                                               placeholder="e.g. Weight Training">-->
<!--                                    </div>-->
                                    <div id="skillContainer">

                                        <div class="d-flex gap-2 mb-2">
                                            <input type="text" name="skills"
                                                   class="form-control"
                                                   placeholder="e.g. Weight Training">

                                            <input type="number" name="percentages"
                                                   class="form-control"
                                                   placeholder="%"
                                                   min="0" max="100">
                                        </div>
                                    </div>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            onclick="addSkill()">+ Add Skill</button>
                                </div>

                                <!-- 🔥 Achievements -->
                                <div class="mb-3">
                                    <label class="form-label">Achievements</label>

                                    <div id="achievementContainer">
                                        <input type="text"
                                               name="achievements"
                                               class="form-control mb-2"
                                               placeholder="e.g. National Champion 2023">
                                    </div>

                                    <button type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            onclick="addAchievement()">+ Add Achievement</button>
                                </div>

                                <!-- Submit -->
                                <div class="d-grid mt-4">
                                    <button class="btn btn-primary btn-lg">
                                        Create Trainer
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>


        </div>
    </main>

</div>

<script>

    //     document.getElementById("skillContainer").appendChild(input);
    // }

    function addSkill() {

        let div = document.createElement("div");
        div.className = "d-flex gap-2 mb-2";

        div.innerHTML = `
        <input type="text" name="skills" class="form-control" placeholder="Skill">
        <input type="number" name="percentages" class="form-control" placeholder="%" min="0" max="100">
    `;

        document.getElementById("skillContainer").appendChild(div);
    }
    function addAchievement() {
        let input = document.createElement("input");
        input.type = "text";
        input.name = "achievements";
        input.className = "form-control mb-2";
        input.placeholder = "New achievement";
        document.getElementById("achievementContainer").appendChild(input);
    }
</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
