<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div class="container mt-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">

                        <h5>
                            Payment History -
                            <span th:text="${member.user.firstName}"></span>
                        </h5>

                        <table class="table table-striped">
                            <thead class="table-dark">
                            <tr>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="p : ${payments}">
                                <td th:text="${p.amount}"></td>
                                <td th:text="${p.method}"></td>
                                <td th:text="${p.paymentDate}"></td>

                                <td>

                                    <a th:href="@{'/admin/payments/edit/' + ${p.paymentId}}"
                                       class="btn btn-sm btn-warning">
                                        Edit
                                    </a>

                                    <form th:action="@{/admin/payments/delete}"
                                          method="post"
                                          style="display:inline;">
                                        <input type="hidden"
                                               name="paymentId"
                                               th:value="${p.paymentId}">
                                        <button class="btn btn-sm btn-danger"
                                                onclick="return confirm('Adjust due and delete?')">
                                            Delete
                                        </button>
                                    </form>

                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(payments)}">
                                <td colspan="4" class="text-center text-muted">
                                    No payments found
                                </td>
                            </tr>

                            </tbody>
                        </table>

                    </div>
                </div>


            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
