<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">
<title>Contact Messages</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container-fluid py-4">

                <div class="container mt-5">

                    <h2 class="mb-4">

                        Contact Messages

                    </h2>

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Subject</th>

                            <th>Status</th>

                            <th>Date</th>

                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="m : ${messages}">

                            <td th:text="${m.name}"></td>

                            <td th:text="${m.email}"></td>

                            <td th:text="${m.subject}"></td>

                            <td>

                <span
                        class="badge bg-success"
                        th:if="${m.status.name()=='NEW'}">

                    NEW

                </span>

                                <span
                                        class="badge bg-warning text-dark"
                                        th:if="${m.status.name()=='READ'}">

                    READ

                </span>

                                <span
                                        class="badge bg-primary"
                                        th:if="${m.status.name()=='REPLIED'}">

                    REPLIED

                </span>

                            </td>

                            <td
                                    th:text="${#temporals.format(m.createdAt,'dd MMM yyyy HH:mm')}">
                            </td>

                            <td>

                                <a th:href="@{'/admin/contact/' + ${m.id}}"
                                   class="btn btn-sm btn-info">

                                    View

                                </a>

                                <a th:href="@{'/admin/contact/reply/' + ${m.id}}"
                                   class="btn btn-sm btn-success">

                                    Reply

                                </a>

                                <a th:href="@{'/admin/contact/delete/' + ${m.id}}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this message?')">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>



            </div>

        </div>
    </main>

</div>
</body>
</html>
