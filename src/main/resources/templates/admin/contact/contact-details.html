<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">
    <title>Contact Messages</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container-fluid py-4">

                <div class="container mt-5">

                    <h2 class="mb-4">

                        Contact Details

                    </h2>

                    <div class="card">

                        <div class="card-body">

                            <h5>Name</h5>

                            <p th:text="${message.name}"></p>

                            <hr>

                            <h5>Email</h5>

                            <p th:text="${message.email}"></p>

                            <hr>

                            <h5>Subject</h5>

                            <p th:text="${message.subject}"></p>

                            <hr>

                            <h5>Message</h5>

                            <p style="white-space: pre-wrap"
                               th:text="${message.message}">
                            </p>

                            <hr>

                            <h5>Status</h5>

                            <p th:text="${message.status}"></p>

                            <hr>

                            <h5>Received</h5>

                            <p th:text="${#temporals.format(message.createdAt,'dd MMM yyyy HH:mm')}"></p>

                            <a th:href="@{'/admin/contact/reply/' + ${message.id}}"
                               class="btn btn-success">

                                Reply

                            </a>

                            <a th:href="@{/admin/contact}"
                               class="btn btn-secondary">

                                Back

                            </a>

                        </div>

                    </div>

                </div>


            </div>

        </div>
    </main>

</div>
</body>
</html>
