<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">
    <title>Contact Messages</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container-fluid py-4">

                <div class="container mt-5">

                    <h2>

                        Reply Message

                    </h2>

                    <form th:action="@{'/admin/contact/reply/' + ${message.id}}"
                          method="post">

                        <div class="mb-3">

                            <label>

                                To

                            </label>

                            <input class="form-control"
                                   th:value="${message.email}"
                                   readonly>

                        </div>

                        <div class="mb-3">

                            <label>

                                Subject

                            </label>

                            <input type="text"
                                   name="subject"
                                   class="form-control"
                                   th:value="'Re: ' + ${message.subject}">

                        </div>

                        <div class="mb-3">

                            <label>

                                Reply

                            </label>

                            <textarea name="body"
                                      rows="8"
                                      class="form-control"
                                      required></textarea>

                        </div>

                        <button class="btn btn-primary">

                            Send Email

                        </button>

                        <a th:href="@{/admin/contact}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>


            </div>

        </div>
    </main>

</div>
</body>
</html>
