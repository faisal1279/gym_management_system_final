<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${error}" class="alert alert-danger">
                <i class="ri-error-warning-line"></i>
                <span th:text="${error}"></span>
            </div>
<!--            <form th:action="@{/admin/members/{id}/assign-trainer(id=${member.memberId})}"-->
<!--                  method="post">-->

<!--                &lt;!&ndash; CSRF token (must for POST) &ndash;&gt;-->
<!--                <input type="hidden"-->
<!--                       th:name="${_csrf.parameterName}"-->
<!--                       th:value="${_csrf.token}" />-->

<!--                <select name="trainerId" class="form-control mb-3" required>-->
<!--                    <option value="" disabled selected>-->
<!--                        &#45;&#45; Select Trainer &#45;&#45;-->
<!--                    </option>-->

<!--                    <option th:each="t : ${trainers}"-->
<!--                            th:value="${t.trainerId}"-->
<!--                            th:text="${t.user.lastName + ' (' + t.specialization + ')'}"-->
<!--                            th:if="${t.active}">-->
<!--                    </option>-->
<!--                </select>-->

<!--                <button type="submit" class="btn btn-primary">-->
<!--                    Assign Trainer-->
<!--                </button>-->
<!--            </form>-->

            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">

                            <h4 class="mb-4 text-center">Assign Trainer</h4>

                            <form th:action="@{/admin/members/{id}/assign-trainer(id=${member.memberId})}"
                                  method="post">

                                <!-- CSRF token -->
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label">Select Trainer</label>

                                    <select name="trainerId"
                                            class="form-select"
                                            required>

                                        <option value="" disabled selected>
                                            -- Select Trainer --
                                        </option>

                                        <!-- Active trainer = selectable -->
                                        <!-- Inactive trainer = disabled -->
                                        <option th:each="t : ${trainers}"
                                                th:value="${t.trainerId}"
                                                th:text="${t.user.lastName + ' (' + t.specialization + ')'}"
                                                th:disabled="${!t.active}">
                                        </option>
                                    </select>

                                    <small class="text-muted">
                                        Inactive trainers cannot be assigned
                                    </small>
                                </div>

                                <div class="d-grid mt-4">
                                    <button type="submit"
                                            class="btn btn-primary btn-lg">
                                        Assign Trainer
                                    </button>
                                </div>

                            </form>

                            <!-- Back Button -->
                            <div class="text-center mt-3">
                                <a th:href="@{/admin/members}"
                                   class="btn btn-link">
                                    ← Back to Members
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
