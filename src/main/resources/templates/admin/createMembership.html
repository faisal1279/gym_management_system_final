<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">

<!--            <div class="container">-->
<!--                <h3>Membership Packages</h3>-->
<!--                <form method="post" th:action="@{/admin/memberships}" class="row g-2 mb-4">-->
<!--                    <div class="col-md-3">-->
<!--                        <input type="text" name="name" class="form-control" placeholder="Name">-->
<!--                    </div>-->
<!--                    <div class="col-md-3">-->
<!--                        <input type="number" name="duration" class="form-control" placeholder="Duration (Days)">-->
<!--                    </div>-->
<!--                    <div class="col-md-3">-->
<!--                        <input type="number" name="price" class="form-control" placeholder="Price">-->
<!--                    </div>-->
<!--                    <div class="col-md-3">-->
<!--                        <button class="btn btn-primary w-100">Create</button>-->
<!--                    </div>-->
<!--                </form>-->
<!--            </div>-->
            <div class="container mt-4">

                <div class="row justify-content-center">
                    <div class="col-lg-10">

                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">

                                <h4 class="mb-4">Create Membership Package</h4>

                                <form method="post"
                                      th:action="@{/admin/memberships}"
                                      class="row g-3">

                                    <div class="col-md-4">
                                        <label class="form-label">Package Name</label>
                                        <input type="text"
                                               name="name"
                                               class="form-control"
                                               placeholder="e.g. Monthly"
                                               required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Duration (Days)</label>
                                        <input type="number"
                                               name="duration"
                                               class="form-control"
                                               min="1"
                                               placeholder="e.g. 30"
                                               required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Price</label>
                                        <input type="number"
                                               name="price"
                                               class="form-control"
                                               min="0"
                                               placeholder="e.g. 3000"
                                               required>
                                    </div>

                                    <div class="col-12 text-end">
                                        <button class="btn btn-primary px-4">
                                            Create Package
                                        </button>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>

            </div>


        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
