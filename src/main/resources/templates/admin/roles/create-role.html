<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Role</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-wrapper">

    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <main class="main-content">

        <div class="container py-4">

            <div class="card shadow">

                <div class="card-header">

                    <h3 class="mb-0">

                        <i class="ri-shield-user-line"></i>

                        Create Role

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/admin/roles/create}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">

                                Role Name

                            </label>

                            <input
                                    type="text"
                                    name="roleName"
                                    class="form-control"
                                    placeholder="ROLE_CONTENT_MANAGER"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            <textarea
                                    name="description"
                                    rows="4"
                                    class="form-control"
                                    placeholder="Write role description..."
                                    required></textarea>

                        </div>

                        <div class="form-check form-switch mb-4">

                            <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="active"
                                    value="true"
                                    checked>

                            <label class="form-check-label">

                                Active

                            </label>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-success">

                            <i class="ri-save-line"></i>

                            Create Role

                        </button>

                        <a th:href="@{/admin/roles}"
                           class="btn btn-secondary">

                            <i class="ri-arrow-left-line"></i>

                            Back

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
