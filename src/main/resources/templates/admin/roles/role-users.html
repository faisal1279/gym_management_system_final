<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Role Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="content">

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="fw-bold">
                        Role Management
                    </h3>

                    <a th:href="@{/admin/roles/create}"
                       class="btn btn-primary">

                        <i class="ri-add-line"></i>

                        Create Role

                    </a>

                </div>
                <h2 th:text="${role.roleName} + ' Users'"></h2>

                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Permission</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="u : ${users}">

                        <td th:text="${u.firstName + ' ' + u.lastName}"></td>

                        <td th:text="${u.email}"></td>

                        <td>

                            <!--            <a th:href="@{/admin/users/{id}/permissions(id=${u.userId})}">-->
                            <!--                Manage Permission-->
                            <!--            </a>-->
                            <a class="btn btn-primary btn-sm"
                               th:href="@{/admin/roles/users/{id}/permissions(id=${u.id})}">
                                Permissions
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>


            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>

</html>
