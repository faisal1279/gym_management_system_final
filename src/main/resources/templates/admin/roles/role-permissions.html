<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assign Permissions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="content">

            <div class="container">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">

                        <h4 class="mb-0">

                            Assign Permissions

                        </h4>

                        <small>

                            <span th:text="${role.roleName}"></span>

                        </small>

                    </div>

                    <div class="card-body">

                        <form method="post"
                              th:action="@{/admin/roles/{id}/permissions(id=${role.roleId})}">

                            <div class="row">

                                <div class="col-md-4 mb-3"

                                     th:each="permission : ${permissions}">

                                    <div class="form-check">

                                        <input class="form-check-input"

                                               type="checkbox"

                                               name="permissionIds"

                                               th:value="${permission.permissionId}"

                                               th:checked="${role.permissions.contains(permission)}">

                                        <label class="form-check-label"

                                               th:text="${permission.permissionName}">

                                        </label>

                                    </div>

                                </div>

                            </div>

                            <hr>

                            <button class="btn btn-success">

                                <i class="ri-save-line"></i>

                                Save Permissions

                            </button>

                            <a th:href="@{/admin/roles}"

                               class="btn btn-secondary">

                                Back

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>

</html>
