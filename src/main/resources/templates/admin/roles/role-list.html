<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Role Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="content">

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="fw-bold">
                        Role Management
                    </h3>

                    <a th:href="@{/admin/roles/create}"
                       class="btn btn-primary">

                        <i class="ri-add-line"></i>

                        Create Role

                    </a>

                </div>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <table class="table table-bordered table-hover align-middle">

                            <thead class="table-dark">

                            <tr>

                                <th>Role</th>

                                <th>Description</th>

                                <th>Status</th>

                                <th width="280">Actions</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="r : ${roles}">

                                <td>

                                    <b th:text="${r.roleName}"></b>

                                </td>

                                <td th:text="${r.description}"></td>

                                <td>

                                    <span class="badge bg-success"

                                          th:if="${r.active}">

                                        Active

                                    </span>

                                    <span class="badge bg-danger"

                                          th:unless="${r.active}">

                                        Inactive

                                    </span>

                                </td>

                                <td>

                                    <a class="btn btn-sm btn-warning"

                                       th:href="@{/admin/roles/edit/{id}(id=${r.roleId})}">

                                        <i class="ri-edit-line"></i>

                                    </a>

                                    <a class="btn btn-sm btn-info"

                                       th:href="@{/admin/roles/{id}/permissions(id=${r.roleId})}">

                                        Permissions

                                    </a>
                                    <a class="btn btn-sm btn-secondary"
                                       th:href="@{/admin/roles/{id}/users(id=${r.roleId})}">
                                        <i class="ri-user-line"></i>
                                        Users
                                    </a>

                                    <a class="btn btn-sm btn-danger"

                                       onclick="return confirm('Delete this role?')"

                                       th:href="@{/admin/roles/delete/{id}(id=${r.roleId})}">

                                        <i class="ri-delete-bin-line"></i>

                                    </a>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>

</html>
