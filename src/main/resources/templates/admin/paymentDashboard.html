<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container mt-4">

                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="row g-4">

                    <!-- Revenue Card -->
                    <div class="col-12">
                        <div class="card shadow-sm border-0 text-center">
                            <div class="card-body p-4">
                                <h6 class="text-muted mb-2">This Month Revenue</h6>
                                <h2 class="fw-bold text-success mb-0"
                                    th:text="${revenue} + ' ৳'"></h2>
                            </div>
                        </div>
                    </div>
                    <!-- Make Payment -->
                    <div class="col-lg-6 col-md-8 mx-auto">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">

                                <h4 class="mb-4 text-center">Make Payment</h4>

                                <form method="post" th:action="@{/admin/payments}">

                                    <div class="mb-3">
                                        <label class="form-label">Member</label>
                                        <select name="memberId"
                                                class="form-select"
                                                required>
                                            <option value="" disabled selected>
                                                -- Select Member --
                                            </option>
                                            <option th:each="m : ${members}"
                                                    th:value="${m.memberId}"
                                                    th:data-price="${m.membership.price}"
                                                    th:data-due="${m.dueAmount}"
                                                    th:text="${m.user.firstName + ' ' + m.user.lastName}">
                                            </option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Plan Price</label>
                                        <input type="text"
                                               id="planPrice"
                                               class="form-control"
                                               readonly
                                               placeholder="Select member first">
                                    </div>

                                    <div class="mb-3 form-check">
                                        <input type="checkbox"
                                               class="form-check-input"
                                               id="partialBox"
                                               onclick="enablePartial()">
                                        <label class="form-check-label" for="partialBox">
                                            Allow Partial Payment
                                        </label>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Amount to Pay</label>
                                        <input type="number"
                                               id="amountInput"
                                               name="amount"
                                               class="form-control"
                                               min="0"
                                               readonly
                                               required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Payment Method</label>
                                        <select name="method"
                                                class="form-select">
                                            <option value="Cash">Cash</option>
                                            <option value="Bkash">Bkash</option>
                                            <option value="Nagad">Nagad</option>
                                        </select>
                                    </div>

                                    <div class="d-grid mt-4">
                                        <button class="btn btn-success btn-lg">
                                            Confirm Payment
                                        </button>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

</div>

<script>

    const memberSelect = document.querySelector("select[name='memberId']");
    const planPriceInput = document.getElementById("planPrice");
    const amountInput = document.getElementById("amountInput");
    const partialBox = document.getElementById("partialBox");
    const submitBtn = document.querySelector("button");

    memberSelect.addEventListener("change", function(){

        let selectedOption = this.options[this.selectedIndex];

        let price = parseFloat(selectedOption.getAttribute("data-price"));
        let due = parseFloat(selectedOption.getAttribute("data-due"));

        planPriceInput.value = price;

        if(due <= 0){
            amountInput.value = 0;
            amountInput.readOnly = true;
            partialBox.checked = false;
            submitBtn.disabled = true;
            alert("This member has no due.");
            return;
        }

        submitBtn.disabled = false;

        // 🟢 If full payment pending → show full price
        // 🟢 If partial already paid → show remaining due
        amountInput.value = due;
        amountInput.max = due;
        amountInput.min = 1;
        amountInput.readOnly = true;
        partialBox.checked = false;
    });

    function enablePartial(){
        if(partialBox.checked){
            amountInput.readOnly = false;
        } else {
            let selectedOption = memberSelect.options[memberSelect.selectedIndex];
            let due = parseFloat(selectedOption.getAttribute("data-due"));
            amountInput.value = due;
            amountInput.readOnly = true;
        }
    }


</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
