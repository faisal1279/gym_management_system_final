<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/pagination.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Member List</title>

</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${message}" class="alert alert-success">
                <i class="ri-checkbox-circle-line"></i>
                <span th:text="${message}"></span>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <h5 class="mb-3 table-title">Members & Membership Status</h5>

                    <div class="table-responsive">
                        <!-- ================= MEMBER SEARCH ================= -->
                        <div class="member-search-bar mb-4">

                            <form method="get" th:action="@{/admin/members}">
                                <div class="row g-2 align-items-center">

                                    <!-- 🔍 Name / Email -->
                                    <div class="col-md-4">
                                        <input type="text"
                                               name="keyword"
                                               class="form-control"
                                               placeholder="Search name or email..."
                                               th:value="${keyword}">
                                    </div>

                                    <!--  Active / Expired -->
                                    <div class="col-md-3">
                                        <select name="active" class="form-select">

                                            <option value="">All Status</option>

                                            <option value="true" th:selected="${active == true}">
                                                Active
                                            </option>

                                            <option value="false" th:selected="${active == false}">
                                                Expired
                                            </option>

                                        </select>
                                    </div>

                                    <!-- 💳 Payment -->
                                    <div class="col-md-3">
                                        <select name="paymentStatus" class="form-select">

                                            <option value="">All Payments</option>

                                            <option value="PAID" th:selected="${paymentStatus == 'PAID'}">
                                                Paid
                                            </option>

                                            <option value="UNPAID" th:selected="${paymentStatus == 'UNPAID'}">
                                                Due / Unpaid
                                            </option>

                                        </select>
                                    </div>

                                    <!-- 🔎 Button -->
                                    <div class="col-md-2">
                                        <button class="btn btn-in w-100">
                                            Search
                                        </button>
                                    </div>

                                </div>
                            </form>

                        </div>
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>Name</th>

                                <th class="d-none d-md-table-cell">Email</th>

                                <th>Membership</th>

                                <th class="d-none d-lg-table-cell">Trainer</th>

                                <th>Status</th>
                                <th>Payment</th>

                                <th class="d-none d-md-table-cell">Valid Till</th>

                                <th>Days Left</th>

                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="m : ${members}">

                                <td th:text="${m.member.user.lastName}"></td>

                                <td class="d-none d-md-table-cell"
                                    th:text="${m.member.user.email}"></td>

                                <td th:text="${m.member.membership.name
                        + ' (' + m.member.membership.durationInDays + ' days)'}">
                                </td>

                                <td class="d-none d-lg-table-cell"
                                    th:text="${m.member.trainer != null ?
                        m.member.trainer.user.lastName : 'Not Assigned'}">
                                </td>

                                <!-- Membership Status -->
                                <td>
                        <span th:if="${m.paid}"
                              class="badge bg-success">Active</span>
                         <span th:if="${!m.paid}"
                                          class="badge bg-danger">Expired</span>
                                </td>

                                <!-- Payment -->

                                <td>

                                    <!-- FULL PAID -->
                                    <span th:if="${m.member.dueAmount == 0}"
                                          class="badge bg-success">
        PAID
    </span>

                                    <!-- PARTIAL PAYMENT -->
                                    <span th:if="${m.member.dueAmount > 0 and m.member.startDate != null}"
                                          class="badge bg-warning text-dark">
        PARTIAL (
        <span th:text="${m.member.dueAmount}"></span> ৳ DUE)
    </span>

                                    <!-- NOT STARTED -->
                                    <span th:if="${m.member.startDate == null}"
                                          class="badge bg-secondary">
        NOT STARTED (
        <span th:text="${m.member.dueAmount}"></span> ৳)
    </span>

                                </td>

                                <!-- Valid Till -->
                                <td class="d-none d-md-table-cell"
                                    th:text="${m.member.endDate}"></td>

                                <!-- Days Left -->
                                <td>
                        <span th:if="${m.daysLeft > 0}"
                              th:text="${m.daysLeft + ' days'}"></span>

                                    <span th:if="${m.daysLeft <= 0}"
                                          class="text-danger fw-bold">0</span>
                                </td>

                                <!-- Action -->
                                <td class="text-nowrap">
                                    <a th:href="@{/admin/members/{id}/assign-trainer(id=${m.member.memberId})}"
                                       class="btn btn-sm btn-primary mb-1">
                                        Assign Trainer
                                    </a>
<!--                                    <a th:href="@{/admin/payments/{id}/pay(id=${m.member.memberId})}"-->
<!--                                       class="btn btn-sm btn-warning mb-1">-->
<!--                                        Take Payment-->
<!--                                    </a>-->
                                    <a th:href="@{/admin/members/{id}/payments(id=${m.member.memberId})}"
                                       class="btn btn-sm btn-info mb-1">
                                        View Payments
                                    </a>
                                </td>

                            </tr>
                            </tbody>
                        </table>

                        <div th:if="${members.size() == 0}" class="text-center py-5">
                            <div class="card p-4 shadow-sm">
                                <i class="ri-user-search-line fs-1 text-muted"></i>
                                <h5 class="mt-2 text-muted">No Members Found</h5>
                            </div>
                        </div>

                        <!--                pagination section-->
                        <div th:if="${totalPages > 1}">
                            <div th:replace="fragments/pagination :: pagination('/admin/members', ${currentPage}, ${totalPages})"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
