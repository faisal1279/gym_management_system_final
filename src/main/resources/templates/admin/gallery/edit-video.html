<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>create blog</title>
    <style>
        .form-control{
            border:1px solid #ccc;
            border-radius:0;
            padding:12px;
        }

        .form-control:focus{
            border:1px solid #000;
            box-shadow:none;
            outline:none;
        }

        .create-btn{
            width:100%;
            background:#222;
            color:#fff;
            padding:12px;
            font-weight:600;
            letter-spacing:2px;
            border:none;
            transition: 0.3s;
        }
        .create-btn:hover{
            background:var(--teal);
            color:#fff;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container py-5">

                <h2 class="mb-4">Edit Video</h2>

                <!-- ALERT -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/admin/gallery/video/update/{id}(id=${video.id})}" method="post">

                    <!-- Video URL -->
                    <div class="mb-3">
                        <label>Video URL (Embed)</label>
                        <input type="text" name="url"
                               th:value="${video.videoUrl}"
                               class="form-control"
                               placeholder="https://www.youtube.com/embed/xxx"
                               required>
                    </div>

                    <!-- Preview -->
                    <div class="mb-3">
                        <label>Preview</label>
                        <iframe
                                th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(video.videoUrl,'youtu.be/'),'?')}"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                style="width:100%; height:250px;"
                                allowfullscreen>
                        </iframe>
                    </div>

                    <!-- Title -->
                    <div class="mb-3">
                        <label>Title</label>
                        <input type="text" name="title"
                               th:value="${video.title}"
                               class="form-control">
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  th:text="${video.description}"></textarea>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label>Category</label>
                        <input type="text" name="category"
                               th:value="${video.category}"
                               class="form-control">
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button class="btn btn-success">Update Video</button>
                        <a href="/admin/gallery" class="btn btn-outline-dark">Cancel</a>
                    </div>

                </form>

            </div>


        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
