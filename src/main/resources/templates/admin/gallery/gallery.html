<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>Gallery Management</title>
    <style>
        .card img{
            height:200px;
            object-fit:cover;
        }

        .action-btns a{
            margin-right:5px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container py-5">

                <!-- HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Gallery Management</h2>

                    <div>
                        <a href="/admin/gallery/image/create" class="btn btn-dark">+ Add Images</a>
                        <a href="/admin/gallery/video/create" class="btn btn-outline-dark">+ Add Video</a>
                    </div>
                </div>

                <!-- SUCCESS / ERROR -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- ================= IMAGES ================= -->
                <h4 class="mb-3">Images</h4>

                <div class="row g-4">

                    <div class="col-lg-3 col-md-4 col-sm-6" th:each="img : ${images}">
                        <div class="card shadow-sm h-100">

                            <!-- CLICKABLE IMAGE -->
                            <a th:href="@{/admin/gallery/image/view/{id}(id=${img.id})}">
                                <img th:src="@{'/uploads/gallery/' + ${img.imageUrl}}"
                                     class="card-img-top">
                            </a>

                            <div class="card-body d-flex flex-column">

                                <h6 th:text="${img.title}"></h6>

                                <p class="text-muted small mb-1" th:text="${img.category}"></p>

                                <!-- SHORT DESCRIPTION -->
                                <p class="small text-truncate" th:text="${img.description}"></p>

                                <!-- BUTTONS -->
                                <div class="mt-auto action-btns">
                                    <a th:href="@{/admin/gallery/image/edit/{id}(id=${img.id})}"
                                       class="btn btn-sm btn-primary">Edit</a>

                                    <a th:href="@{/admin/gallery/image/delete/{id}(id=${img.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this image?')">Delete</a>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- ================= VIDEOS ================= -->
                <h4 class="mt-5 mb-3">Videos</h4>

                <div class="row g-4">

                    <div class="col-lg-4 col-md-6" th:each="v : ${videos}">
                        <div class="card shadow-sm">

                            <!-- YouTube Embed -->
                            <iframe
                                    th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(v.videoUrl,'youtu.be/'),'?')}"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    style="width:100%; height:200px;"
                                    allowfullscreen>
                            </iframe>

                            <div class="card-body">

                                <h6 th:text="${v.title}"></h6>

                                <p class="text-muted small" th:text="${v.category}"></p>

                                <p class="small" th:text="${v.description}"></p>

                                <div class="mt-auto action-btns">

                                    <a th:href="@{/admin/gallery/video/edit/{id}(id=${v.id})}"
                                       class="btn btn-sm btn-primary">Edit</a>

                                    <a th:href="@{/admin/gallery/video/delete/{id}(id=${v.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this video?')">Delete</a>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </div>


        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
