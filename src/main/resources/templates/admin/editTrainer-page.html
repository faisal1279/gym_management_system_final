<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">

                            <h4 class="mb-4 text-center">Edit Trainer</h4>
                            <form th:action="@{/admin/trainers/edit/{id}(id=${trainer.trainerId})}"
                                  method="post">

                                <!-- Specialization -->
                                <div class="mb-3">
                                    <label class="form-label">Specialization</label>
                                    <input type="text"
                                           name="specialization"
                                           th:value="${trainer.specialization}"
                                           class="form-control"
                                           required>
                                </div>

                                <!-- Experience -->
                                <div class="mb-3">
                                    <label class="form-label">Experience (Years)</label>
                                    <input type="number"
                                           name="experienceYears"
                                           th:value="${trainer.experienceYears}"
                                           class="form-control"
                                           min="0"
                                           required>
                                </div>

                                <!-- Salary -->
                                <div class="mb-3">
                                    <label class="form-label">Salary</label>
                                    <input type="number"
                                           name="salary"
                                           th:value="${trainer.salary}"
                                           class="form-control"
                                           min="0"
                                           required>
                                </div>

                                <!-- Bio -->
                                <div class="mb-3">
                                    <label class="form-label">Bio</label>
                                    <textarea name="bio"
                                              class="form-control"
                                              rows="4"
                                              th:text="${trainer.bio}"></textarea>
                                </div>

                                <!-- 🔥 Skills -->
                                <div class="mb-3">
                                    <label class="form-label">Skills</label>
                                    <div id="skillContainer">
                                        <div th:each="s, stat : ${trainer.skills}" class="d-flex gap-2 mb-2">
                                            <!-- Skill Name -->
                                            <input type="text"
                                                   name="skills"
                                                   th:value="${s.skillName}"
                                                   class="form-control"
                                                   placeholder="Skill">

                                            <!-- Skill Percentage -->
                                            <input type="number"
                                                   name="skillPercentages"
                                                   th:value="${s.percentage}"
                                                   class="form-control"
                                                   placeholder="%"
                                                   min="0" max="100">

                                            <!-- Optional: Remove button -->
                                            <button type="button" class="btn btn-sm btn-danger"
                                                    onclick="this.parentElement.remove()">Remove</button>
                                        </div>
                                    </div>

                                    <button type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            onclick="addSkill()">+ Add Skill</button>
                                </div>

                                <!-- 🔥 Achievements -->
                                <div class="mb-3">
                                    <label class="form-label">Achievements</label>

                                    <div id="achievementContainer">
                                        <input type="text"
                                               name="achievements"
                                               class="form-control mb-2"
                                               th:each="a : ${trainer.achievements}"
                                               th:value="${a.title}">
                                    </div>

                                    <button type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            onclick="addAchievement()">+ Add Achievement</button>
                                </div>

                                <!-- Submit -->
                                <div class="d-grid mt-4">
                                    <button class="btn btn-success btn-lg">
                                        Update Trainer
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

</div>

<script>
    function addSkill() {
        let div = document.createElement("div");
        div.className = "d-flex gap-2 mb-2";

        div.innerHTML = `
        <input type="text" name="skills" class="form-control" placeholder="Skill">
        <input type="number" name="skillPercentages" class="form-control" placeholder="%" min="0" max="100">
        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">Remove</button>
    `;
        document.getElementById("skillContainer").appendChild(div);
    }

    function addAchievement() {
        let input = document.createElement("input");
        input.type = "text";
        input.name = "achievements";
        input.className = "form-control mb-2";
        document.getElementById("achievementContainer").appendChild(input);
    }
</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
