<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${error}" class="alert alert-danger">
                <i class="ri-error-warning-line"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{'/admin/users/' + ${user.id} + '/make-member'}"
                  method="post">

                <!-- Membership Package -->
                <div class="mb-3">
                    <label class="form-label">Membership Package</label>
                    <select name="membershipId" class="form-control" required>
                        <option value="">-- Select Package --</option>
                        <option th:each="m : ${memberships}"
                                th:value="${m.membershipId}"
                                th:text="${m.name + ' (' + m.durationInDays + ' days)'}">
                        </option>
                    </select>
                </div>

                <!-- Weight -->
                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number"
                           step="0.1"
                           name="weight"
                           class="form-control"
                           required>
                </div>

                <!-- Height -->
                <div class="mb-3">
                    <label class="form-label">Height (cm)</label>
                    <input type="number"
                           step="0.1"
                           name="height"
                           class="form-control"
                           required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Create Member
                </button>
            </form>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
