<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">

            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <h4 class="mb-3">Member Progress Overview</h4>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                            <tr>
                                <th>Member</th>
                                <th>Phone</th>
                                <th>Start Weight</th>
                                <th>Current Weight</th>
                                <th>Goal</th>
                                <th>Last Update</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="m : ${members}">

                                <!-- Name -->
                                <td class="fw-semibold"
                                    th:text="${m.user.firstName + ' ' + m.user.lastName}">
                                </td>

                                <!-- Phone -->
                                <td th:text="${m.user.phone}"></td>

                                <!-- Initial Weight -->
                                <td>
                            <span class="badge bg-secondary"
                                  th:text="${m.initialWeight + ' kg'}">
                            </span>
                                </td>

                                <!-- Current Weight -->
                                <td>
                            <span th:if="${latestProgressMap[m.memberId] != null}"
                                  class="badge bg-info text-dark"
                                  th:text="${latestProgressMap[m.memberId].weight + ' kg'}">
                            </span>

                                    <span th:if="${latestProgressMap[m.memberId] == null}"
                                          class="text-muted">
                                N/A
                            </span>
                                </td>

                                <!-- Goal -->
                                <td>
                            <span class="text-primary fw-medium">
                                Weight Tracking
                            </span>
                                </td>

                                <!-- Last Update -->
                                <td>
                            <span th:if="${latestProgressMap[m.memberId] != null}"
                                  th:text="${latestProgressMap[m.memberId].recordDate}">
                            </span>

                                    <span th:if="${latestProgressMap[m.memberId] == null}"
                                          class="text-muted">
                                N/A
                            </span>
                                </td>

                                <!-- Action -->
                                <td>
                                    <a th:href="@{'/trainer/members/' + ${m.memberId} + '/progress'}"
                                       class="btn btn-sm btn-outline-primary ">
                                        <i class="ri-eye-line me-1"></i>
                                        View
                                    </a>
                                </td>

                            </tr>

                            <!-- Empty State -->
                            <tr th:if="${members.size == 0}">
                                <td colspan="7"
                                    class="text-center text-muted py-4">
                                    No progress data available
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </div>


    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
