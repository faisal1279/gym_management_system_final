<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>Admin Dashboard</title>
    <style>
        .exercise-img{
            height:200px;
            object-fit:cover;
            transition:0.3s;
        }

        .exercise-img:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container py-5">

                <div class="row justify-content-center">
                    <div class="col-lg-10">

                        <div class="card shadow border-0 rounded-4 p-4">

                            <!-- Title -->
                            <h2 class="fw-bold mb-3"
                                th:text="${exercise.name}">
                            </h2>

                            <!-- Description -->
                            <p class="text-muted">
                                <strong>Description:</strong><br>
                                <span th:text="${exercise.description}"></span>
                            </p>

                            <!-- Warning -->
                            <p>
                                <strong class="text-danger">Warning:</strong><br>
                                <span th:text="${exercise.warning}"></span>
                            </p>

                            <!-- Images Section -->
                            <h4 class="mt-4 mb-3">Exercise Images</h4>

                            <div class="row g-3">

                                <div class="col-lg-3 col-md-4 col-6"
                                     th:each="img : ${exercise.images}">

                                    <a th:href="@{'/uploads/exercises/' + ${img.imageUrl}}"
                                       data-lightbox="exercise">

                                        <img th:src="@{'/uploads/exercises/' + ${img.imageUrl}}"
                                             class="img-fluid rounded shadow-sm exercise-img">

                                    </a>

                                </div>

                                <div th:if="${#lists.isEmpty(exercise.images)}">
                                    <p class="text-muted">No images available</p>
                                </div>

                            </div>

                            <!-- Videos Section -->
                            <h5 class="mt-4">Videos</h5>

                            <div class="row">

                                <div class="col-lg-6 mb-4"
                                     th:each="vid : ${exercise.videos}">

                                    <div class="ratio ratio-16x9 shadow rounded">

                                        <iframe
                                                th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(vid.videoUrl,'youtu.be/'),'?')}"
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                allowfullscreen>
                                        </iframe>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
