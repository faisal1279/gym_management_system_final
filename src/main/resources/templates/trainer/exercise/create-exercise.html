<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div class="container-fluid py-4">

                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <div class="card shadow-sm border-0 rounded-4">

                            <div class="card-body p-4">

                                <h3 class="mb-4">Create Exercise</h3>

                                <form th:action="@{/trainer/exercise/create}"
                                      method="post"
                                      enctype="multipart/form-data">

                                    <!-- Exercise Name -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Exercise Name</label>
                                        <input type="text"
                                               name="name"
                                               class="form-control"
                                               placeholder="Enter exercise name"
                                               required>
                                    </div>

                                    <!-- Description -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Description</label>
                                        <textarea name="description"
                                                  class="form-control"
                                                  rows="4"
                                                  placeholder="Explain how to perform"></textarea>
                                    </div>

                                    <!-- Warning -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Warning</label>
                                        <textarea name="warning"
                                                  class="form-control"
                                                  rows="3"
                                                  placeholder="Example: Do not perform if you have back pain"></textarea>
                                    </div>

                                    <!-- Image Upload -->
                                    <div class="mb-3">

                                        <label class="form-label fw-semibold">Exercise Images</label>

                                        <input type="file"
                                               name="images"
                                               class="form-control"
                                               id="imageUpload"
                                               multiple>

                                        <div id="imagePreview"
                                             class="d-flex flex-wrap gap-2 mt-3">
                                        </div>

                                    </div>

                                    <!-- Video URLs -->
                                    <div class="mb-3">

                                        <label class="form-label fw-semibold">Video URLs</label>

                                        <div id="videoContainer">

                                            <div class="input-group mb-2 video-field">

                                                <input type="text"
                                                       name="videoUrls"
                                                       class="form-control"
                                                       placeholder="YouTube video link">

                                                <button type="button"
                                                        class="btn btn-danger removeVideo">
                                                    Remove
                                                </button>

                                            </div>

                                        </div>

                                        <button type="button"
                                                class="btn btn-outline-primary btn-sm mt-2"
                                                id="addVideo">

                                            ➕ Add Video

                                        </button>

                                    </div>

                                    <div class="form-check mb-3">

                                        <input type="hidden" name="active" value="false">

                                        <input type="checkbox"
                                               name="active"
                                               value="true"
                                               class="form-check-input"
                                               id="publishCheck">

                                        <label class="form-check-label">
                                            Publish Now
                                        </label>

                                    </div>

                                    <!-- Submit -->
                                    <button class="btn btn-primary mt-3">
                                        Create Exercise
                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        // ====================
        // Add Video Field
        // ====================

        const addBtn = document.getElementById("addVideo");
        const container = document.getElementById("videoContainer");

        addBtn.addEventListener("click", function () {

            const div = document.createElement("div");

            div.classList.add("input-group", "mb-2", "video-field");

            div.innerHTML = `
            <input type="text"
                   name="videoUrls"
                   class="form-control"
                   placeholder="YouTube video link">

            <button type="button"
                    class="btn btn-danger removeVideo">
                Remove
            </button>
        `;

            container.appendChild(div);
        });


        // ====================
        // Remove Video Field
        // ====================

        document.addEventListener("click", function(e){

            if(e.target.classList.contains("removeVideo")){

                e.target.closest(".video-field").remove();

            }

        });


        // ====================
        // Image Preview
        // ====================

        const imageInput = document.getElementById("imageUpload");
        const preview = document.getElementById("imagePreview");

        imageInput.addEventListener("change", function(){

            preview.innerHTML = "";

            const files = this.files;

            for(let i=0;i<files.length;i++){

                const reader = new FileReader();

                reader.onload = function(e){

                    const img = document.createElement("img");

                    img.src = e.target.result;

                    img.style.width = "90px";
                    img.style.height = "90px";
                    img.style.objectFit = "cover";
                    img.style.borderRadius = "8px";

                    preview.appendChild(img);
                }

                reader.readAsDataURL(files[i]);

            }

        });

    });
</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
