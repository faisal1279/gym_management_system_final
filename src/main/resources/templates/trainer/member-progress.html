<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">

            <!-- Progress Card -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">

                    <h4 class="mb-3">Member Progress</h4>

                    <p class="mb-4">
                        <strong>Start Weight:</strong>
                        <span class="badge bg-secondary"
                              th:text="${member.initialWeight + ' kg'}">
                </span>
                    </p>

                    <!-- Add Progress Form -->
                    <form th:action="@{'/trainer/members/' + ${member.memberId} + '/progress/add'}"
                          method="post">

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">Weight (kg)</label>
                                <input type="number"
                                       step="0.1"
                                       name="weight"
                                       class="form-control"
                                       placeholder="Enter weight"
                                       required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Body Fat (%)</label>
                                <input type="number"
                                       step="0.1"
                                       name="bodyFat"
                                       class="form-control"
                                       placeholder="Enter body fat %"
                                       required>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Notes</label>
                                <textarea name="notes"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Progress notes..."></textarea>
                            </div>

                            <div class="col-12 d-grid mt-3">
                                <button type="submit"
                                        class="btn btn-primary">
                                    <i class="ri-add-line me-1"></i>
                                    Add Progress
                                </button>
                            </div>

                        </div>

                    </form>

                </div>
            </div>

            <!-- Progress History -->
            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <h5 class="mb-3">Progress History</h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Weight</th>
                                <th>Weight Diff</th>
                                <th>BMI</th>
                                <th>Body Fat</th>
                                <th>Notes</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="p, stat : ${progressList}">

                                <!-- Date -->
                                <td th:text="${p.recordDate}"></td>

                                <!-- Weight -->
                                <td>
            <span class="badge bg-info text-dark"
                  th:text="${p.weight + ' kg'}">
            </span>
                                </td>

                                <!-- Weight Change -->

                                <td>
                <span class="badge bg-warning text-dark"
                      th:text="${weightChange[p.id] != null ? weightChange[p.id] + ' kg' : '0 kg'}">
                </span>

                                </td>

                                <!-- BMI -->
                                <td th:text="${p.bmi}"></td>

                                <!-- Body Fat -->
                                <td th:text="${p.bodyFat + ' %'}"></td>

                                <!-- Notes -->
                                <td th:text="${p.notes}"></td>

                                <!-- Action -->
                                <td class="d-flex gap-2">

                                    <!-- Delete -->
                                    <form th:action="@{'/trainer/progress/' + ${p.id} + '/delete'}"
                                          method="post">

                                        <input type="hidden"
                                               name="memberId"
                                               th:value="${member.memberId}">

                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Are you sure you want to delete this progress?');">
                                            <i class="ri-delete-bin-line"></i>
                                        </button>
                                    </form>

                                    <!-- Edit -->
                                    <a th:href="@{'/trainer/progress/' + ${p.id} + '/edit?memberId=' + ${member.memberId}}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="ri-edit-line"></i>
                                    </a>

                                </td>

                            </tr>

                            <!-- Empty State -->
                            <tr th:if="${progressList.size() == 0}">
                                <td colspan="7"
                                    class="text-center text-muted py-4">
                                    No progress records yet
                                </td>
                            </tr>

                            </tbody>

                        </table>
