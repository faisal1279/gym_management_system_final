<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <div class="container-fluid py-4">

                <!-- Page Header -->
                <div class="mb-4">
                    <h3 class="fw-bold">Assign Routine</h3>
                    <p class="text-muted mb-0">Assign workout routine template to member</p>
                </div>

                <div class="row justify-content-center">

                    <div class="col-lg-6 col-md-8 col-12">

                        <div class="card shadow-sm border-0 rounded-4">

                            <div class="card-body p-4">

                                <!-- Member Info -->
                                <div class="mb-4">

                                    <h5 class="fw-semibold mb-2">Member</h5>

                                    <div class="p-3 bg-light rounded-3">

                            <span class="fw-bold"
                                  th:text="${member.user.firstName + ' ' + member.user.lastName}">
                            </span>

                                    </div>

                                </div>

                                <!-- Form -->
                                <form th:action="@{/trainer/member/assign-routine}" method="post">

                                    <input type="hidden"
                                           name="memberId"
                                           th:value="${member.memberId}">

                                    <!-- Template Select -->
                                    <div class="mb-4">

                                        <label class="form-label fw-semibold">
                                            Select Routine Template
                                        </label>

                                        <select name="templateId"
                                                class="form-select"
                                                required>

                                            <option value="">
                                                Choose Template
                                            </option>

                                            <option th:each="t : ${templates}"
                                                    th:value="${t.id}"
                                                    th:text="${t.name + ' - ' + t.level}">
                                            </option>

                                        </select>

                                    </div>

                                    <!-- Buttons -->
                                    <div class="d-flex gap-2 flex-wrap">

                                        <button class="btn btn-success">
                                            Assign Routine
                                        </button>

                                        <a th:href="@{/trainer/members}"
                                           class="btn btn-outline-secondary">
                                            Back
                                        </a>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
