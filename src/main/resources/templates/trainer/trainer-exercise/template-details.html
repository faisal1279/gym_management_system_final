<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <div class="container-fluid py-4">

                <!-- HEADER -->
                <div class="mb-4">
                    <h3 class="fw-bold" th:text="${template.name}"></h3>
                    <p class="text-muted mb-0">Manage template workout days & exercises</p>
                </div>

                <!-- ADD DAY CARD -->
                <div class="card shadow-sm border-0 rounded-4 mb-4">

                    <div class="card-body">

                        <h5 class="fw-semibold mb-3">Add Workout Day</h5>

                        <form th:action="@{/trainer/template/day/add}" method="post">

                            <input type="hidden"
                                   name="templateId"
                                   th:value="${template.id}">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <select name="day" class="form-select">

                                        <option value="MONDAY">MONDAY</option>
                                        <option value="TUESDAY">TUESDAY</option>
                                        <option value="WEDNESDAY">WEDNESDAY</option>
                                        <option value="THURSDAY">THURSDAY</option>
                                        <option value="FRIDAY">FRIDAY</option>
                                        <option value="SATURDAY">SATURDAY</option>
                                        <option value="SUNDAY">SUNDAY</option>

                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <button class="btn btn-in w-100">
                                        Add Day
                                    </button>
                                </div>

                            </div>

                        </form>

                    </div>

                </div>


                <!-- EMPTY MESSAGE -->
                <div th:if="${#lists.isEmpty(days)}"
                     class="alert alert-info text-center">
                    No workout days added yet
                </div>


                <!-- DAYS LOOP -->
                <div th:each="day : ${days}"
                     class="card shadow-sm border-0 rounded-4 mb-4">

                    <div class="card-body">

                        <!-- DAY TITLE -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0" th:text="${day.day}"></h5>
                            <span class="badge bg-secondary">Workout Day</span>
                        </div>

                        <!-- ADD EXERCISE -->
                        <div class="border rounded-3 p-3 mb-3 bg-light">

                            <h6 class="fw-semibold mb-3">Add Exercise</h6>

                            <form th:action="@{/trainer/template/exercise/add}" method="post">

                                <input type="hidden"
                                       name="templateDayId"
                                       th:value="${day.id}">

                                <div class="row g-2">

                                    <div class="col-lg-3 col-md-6">

                                        <select name="exerciseId" class="form-select">

                                            <option value="">Select Exercise</option>

                                            <option th:each="ex : ${exercises}"
                                                    th:value="${ex.exerciseId}"
                                                    th:text="${ex.name}">
                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-lg-1 col-md-3">
                                        <input type="number"
                                               name="sets"
                                               class="form-control"
                                               placeholder="Sets">
                                    </div>

                                    <div class="col-lg-1 col-md-3">
                                        <input type="number"
                                               name="reps"
                                               class="form-control"
                                               placeholder="Reps">
                                    </div>

                                    <div class="col-lg-2 col-md-4">
                                        <input type="number"
                                               name="duration"
                                               class="form-control"
                                               placeholder="Duration">
                                    </div>

                                    <div class="col-lg-3 col-md-8">
                                        <input type="text"
                                               name="notes"
                                               class="form-control"
                                               placeholder="Notes">
                                    </div>

                                    <div class="col-lg-2 col-md-12">
                                        <button class="btn btn-in w-100">
                                            Add Exercise
                                        </button>
                                    </div>

                                </div>

                            </form>

                        </div>


                        <!-- EXERCISE LIST -->
                        <div>

                            <h6 class="fw-semibold mb-2">Exercises</h6>

                            <div th:if="${#lists.isEmpty(day.exercises)}"
                                 class="text-muted small">
                                No exercises added yet
                            </div>

                            <ul class="list-group">

                                <li class="list-group-item d-flex justify-content-between align-items-center"
                                    th:each="ex : ${day.exercises}">

                                    <div>

                                        <strong th:text="${ex.exercise.name}"></strong>

                                        <div class="small text-muted">

                                <span th:if="${ex.sets != null}">
                                    Sets: <span th:text="${ex.sets}"></span>
                                </span>

                                            <span th:if="${ex.reps != null}">
                                    | Reps: <span th:text="${ex.reps}"></span>
                                </span>

                                            <span th:if="${ex.duration != null}">
                                    | Duration: <span th:text="${ex.duration}"></span>
                                </span>

                                        </div>

                                    </div>

                                    <span class="text-muted small"
                                          th:text="${ex.notes}">
                                    </span>

                                    <!-- VIEW BUTTON -->

                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{'/trainer/exercise/details/' + ${ex.exercise.exerciseId}}">

                                        <i class="ri-eye-line"></i>

                                    </a>

                                </li>

                            </ul>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
