<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>
            <div class="container mt-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <!-- Title -->
                        <h2 class="fw-bold mb-3" th:text="${row.exerciseName}"></h2>

                        <!-- Basic Info -->
                        <div class="row g-3 mb-4">

                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light rounded text-center">
                                    <small class="text-muted d-block">Level</small>
                                    <span class="fw-semibold" th:text="${row.level}"></span>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light rounded text-center">
                                    <small class="text-muted d-block">Day</small>
                                    <span class="fw-semibold" th:text="${row.day}"></span>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light rounded text-center">
                                    <small class="text-muted d-block">Sets</small>
                                    <span class="fw-semibold" th:text="${row.sets}"></span>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light rounded text-center">
                                    <small class="text-muted d-block">Reps</small>
                                    <span class="fw-semibold" th:text="${row.reps}"></span>
                                </div>
                            </div>

                        </div>

                        <!-- Images -->
                        <h5 class="fw-semibold mb-3">Exercise Images</h5>

                        <div class="row g-3">

                            <div class="col-6 col-md-4 col-lg-3"
                                 th:each="img : ${row.images}">

                                <img th:src="@{'/uploads/exercises/' + ${img}}"
                                     class="img-fluid rounded shadow-sm"
                                     style="object-fit:cover">

                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- Videos -->
                        <h5 class="fw-semibold mb-3">Exercise Videos</h5>

                        <div class="row g-3"
                             th:if="${row.youtubeLink != null}">

                            <div class="col-md-6 col-lg-4"
                                 th:each="vid : ${row.youtubeLink}">

                                <div class="ratio ratio-16x9">

                                    <iframe
                                            th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(vid,'youtu.be/'),'?')}"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowfullscreen
                                            class="rounded shadow-sm">
                                    >
                                    </iframe>

                                </div>

                            </div>

                        </div>

                        <hr class="my-4">

                        <!-- Description -->
                        <h5 class="fw-semibold mb-2">Description</h5>

                        <div class="p-3 bg-light rounded mb-4">
                            <p class="mb-0" th:text="${row.description}"></p>
                        </div>

                        <!-- Warning -->
                        <h5 class="fw-semibold text-danger mb-2">Warnings</h5>

                        <div class="p-3 border border-danger rounded bg-light">
                            <p class="mb-0 text-danger" th:text="${row.warning}"></p>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
