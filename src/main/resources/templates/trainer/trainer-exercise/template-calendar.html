<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">

    <title>Routine Details</title>

</head>

<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">

        <div class="content">

            <div class="container py-5">

                <!-- Header -->
                <div class="text-center mb-5">

                    <h2 class="fw-bold" th:text="${template.name}"></h2>

                    <span class="badge bg-primary px-3 py-2 fs-6"
                          th:text="${template.level}">
</span>

                </div>

                <!-- DAYS -->

                <div class="row g-4">

                    <div class="col-lg-3 col-md-4 col-sm-6"
                         th:each="day : ${days}">

                        <div class="card border-0 shadow-sm h-100 routine-card">

                            <!-- Day Header -->
                            <div class="card-header text-center bg-dark text-white fw-semibold">

                                <i class="ri-calendar-line me-1"></i>
                                <span th:text="${day.day}"></span>

                            </div>

                            <div class="card-body">

                                <!-- Exercises -->

                                <div th:each="ex : ${day.exercises}" class="mb-3">

                                    <button class="btn btn-light border w-100 text-start"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#exerciseModal'+${day.day}+${ex.exercise.exerciseId}">

                                        <div class="d-flex justify-content-between align-items-center">

<span class="fw-semibold"
      th:text="${ex.exercise.name}">
</span>

                                            <span class="badge bg-primary">

<span th:text="${ex.sets}"></span>x
<span th:text="${ex.reps}"></span>

</span>

                                        </div>

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- ================= MODALS ================= -->

<div th:each="day : ${days}">
    <div th:each="ex : ${day.exercises}">

        <div class="modal fade"
             th:id="'exerciseModal'+${day.day}+${ex.exercise.exerciseId}"
             tabindex="-1">

            <div class="modal-dialog modal-lg modal-dialog-centered">

                <div class="modal-content border-0 shadow">

                    <div class="modal-header border-0">

                        <h5 class="modal-title fw-bold"
                            th:text="${ex.exercise.name}">
                        </h5>

                        <button class="btn-close"
                                data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <!-- Images -->

                        <div class="row g-3 mb-4">

<!--                            <div class="col-md-6"-->
<!--                                 th:each="img : ${ex.exercise.images}">-->

<!--                                <img th:src="@{'/uploads/exercises/' + ${img}}"-->
<!--                                     class="img-fluid rounded shadow-sm">-->
<!--                            </div>-->
                            <div class="col-md-6" th:each="img : ${ex.exercise.images}">
                                <img th:src="@{'/uploads/exercises/' + img.imageUrl}"
                                     class="img-fluid rounded shadow-sm">
                            </div>

                        </div>

                        <!-- Videos -->

                        <div th:if="${ex.exercise.videos != null}">

                            <div class="ratio ratio-16x9 mb-3"
                                 th:each="vid : ${ex.exercise.videos}">

                                <iframe
                                        th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(vid.videoUrl,'youtu.be/'),'?')}"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen
                                        >
                                    >
                                </iframe>

                            </div>

                        </div>

                        <!-- Description -->

                        <div class="mb-3">

                            <h6 class="fw-semibold">Description</h6>

                            <p class="text-muted"
                               th:text="${ex.exercise.description}">
                            </p>

                        </div>

                        <!-- Warning -->

                        <div class="alert alert-danger py-2"
                             th:if="${ex.exercise.warning != null}">

                            <b>Warning:</b>

                            <span th:text="${ex.exercise.warning}"></span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<!-- Scripts -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
