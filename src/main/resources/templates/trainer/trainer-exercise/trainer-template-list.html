<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/makeTrainer.css}">
    <link rel="stylesheet" th:href="@{/css/form-design.css}">


    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content">
            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>
            <div class="container-fluid py-4">

                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                    <h3 class="fw-bold mb-2">Routine Templates</h3>
                    <span class="text-muted">Create & Manage Workout Templates</span>
                </div>

                <!-- SUCCESS MESSAGE -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- ERROR MESSAGE -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- CREATE TEMPLATE -->
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body">

                        <h5 class="fw-semibold mb-3">Create New Template</h5>

                        <form th:action="@{/trainer/template}" method="post">

                            <div class="row g-3">

                                <div class="col-lg-5 col-md-12">
                                    <input type="text"
                                           name="name"
                                           class="form-control"
                                           placeholder="Template Name"
                                           required>
                                </div>

                                <div class="col-lg-4 col-md-6">
                                    <select name="level" class="form-select">
                                        <option value="Beginner">Beginner</option>
                                        <option value="Intermediate">Intermediate</option>
                                        <option value="Advanced">Advanced</option>
                                    </select>
                                </div>

                                <div class="col-lg-3 col-md-6">
                                    <button class="btn btn-in w-100">
                                        Create Template
                                    </button>
                                </div>

                            </div>

                        </form>

                    </div>
                </div>

                <!-- TEMPLATE LIST -->
                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body">

                        <h5 class="fw-semibold mb-3">All Templates</h5>

                        <!-- ================= DESKTOP TABLE ================= -->

                        <div class="table-responsive d-none d-md-block">

                            <table class="table table-hover align-middle">

                                <thead class="table-dark">
                                <tr>
                                    <th>Name</th>
                                    <th>Level</th>
                                    <th width="120">Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:if="${#lists.isEmpty(templates)}">
                                    <td colspan="3" class="text-center text-muted py-4">
                                        No routine templates created yet
                                    </td>
                                </tr>

                                <tr th:each="t : ${templates}">

                                    <td class="fw-semibold" th:text="${t.name}"></td>

                                    <td>
                            <span class="badge bg-primary"
                                  th:text="${t.level}">
                            </span>
                                    </td>

<!--                                    <td>-->

<!--                                        <a class="btn btn-sm btn-outline-primary"-->
<!--                                           th:href="@{'/trainer/template/details/' + ${t.id}}">-->
<!--                                            Manage-->
<!--                                        </a>-->
<!--                                        <a class="btn btn-sm btn-success"-->
<!--                                           th:href="@{'/trainer/template/view/' + ${t.id}}">-->
<!--                                            <i class="ri-eye-line"></i> View-->
<!--                                        </a>-->

<!--                                    </td>-->
                                    <td class="d-flex gap-2">
                                            <a class="btn btn-sm btn-outline-primary"
                                               th:href="@{'/trainer/template/details/' + ${t.id}}">
                                                Manage
                                            </a>
                                            <a class="btn btn-sm btn-success"
                                               th:href="@{'/trainer/template/view/' + ${t.id}}">
                                                <i class="ri-eye-line"></i> View
                                            </a>
                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                        <!-- ================= MOBILE CARD VIEW ================= -->

                        <div class="d-md-none">

                            <!-- EMPTY -->
                            <div th:if="${#lists.isEmpty(templates)}"
                                 class="text-center text-muted py-4">
                                No routine templates created yet
                            </div>

                            <!-- CARDS -->
                            <div class="card mb-3 border-0 shadow-sm"
                                 th:each="t : ${templates}">

                                <div class="card-body">

                                    <h6 class="fw-bold mb-2"
                                        th:text="${t.name}">
                                    </h6>

                                    <div class="mb-2">

                            <span class="badge bg-primary"
                                  th:text="${t.level}">
                            </span>

                                    </div>

                                    <a class="btn btn-sm btn-outline-primary w-100"
                                       th:href="@{'/trainer/template/details/' + ${t.id}}">
                                        Manage Template
                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
