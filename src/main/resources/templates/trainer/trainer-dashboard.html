<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">

            <!-- Trainer Profile Header -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body d-flex flex-column flex-md-row align-items-center gap-4">

                    <!-- Trainer Image -->
                    <div class="text-center">

                        <img th:if="${trainer.user.profileImage != null}"
                             th:src="@{'/uploads/profile/' + ${trainer.user.profileImage}}"
                             alt="Trainer Image"
                             class="rounded-circle shadow"
                             style="width:120px;
                                height:120px;
                                object-fit:cover;
                                object-position:center;"
                             onerror="this.src='/images/default.png'">


                        <div th:if="${trainer.user.profileImage == null}"
                             class="rounded-circle shadow d-flex align-items-center justify-content-center bg-light"
                             style="width:120px;
            height:120px;">

                            <i class="ri-user-3-line"
                               style="font-size:50px; color:#6c757d;"></i>

                        </div>


                    </div>

                    <!-- Trainer Info -->
                    <div class="text-center text-md-start">
                        <h3 class="mb-1">
                            Welcome,
                            <span th:text="${trainer.user.firstName}">Trainer Name</span>
                        </h3>
                        <p class="text-muted mb-1">
                            <i class="ri-mail-line me-1"></i>
                            <span th:text="${trainer.user.email}">trainer@example.com</span>
                        </p>
                        <p class="mb-0">
                    <span class="badge bg-dark"
                          th:text="${trainer.specialization}">
                        Specialization
                    </span>
                        </p>
                    </div>

                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="row g-4">

                <!-- Total Members -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted">Total Members</h6>
                                <h2 class="fw-bold mb-0" th:text="${totalMembers}">0</h2>
                            </div>
                            <div class="bg-primary text-white rounded-circle p-3">
                                <i class="ri-group-line fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Active Members -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted">Active Members</h6>
                                <h2 class="fw-bold mb-0 text-success"
                                    th:text="${activeMembers}">0</h2>
                            </div>
                            <div class="bg-success text-white rounded-circle p-3">
                                <i class="ri-user-follow-line fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Quick Links -->
            <div class="card shadow-sm border-0 mt-4">
                <div class="card-body">
                    <h5 class="mb-3">Quick Links</h5>
                    <div class="d-flex flex-wrap gap-3">
                        <a th:href="@{/trainer/members}"
                           class="btn btn-outline-primary">
                            <i class="ri-team-line me-1"></i>
                            View Members
                        </a>

                        <a th:href="@{/trainer/progress}"
                           class="btn btn-outline-dark">
                            <i class="ri-line-chart-line me-1"></i>
                            View Progress
                        </a>
                    </div>
                </div>
            </div>

            <!-- Recent Member Progress -->
            <div class="card shadow-sm border-0 mt-4">
                <div class="card-body">

                    <h5 class="mb-3">Recent Member Progress</h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Start Weight</th>
                                <th>Current Weight</th>
                                <th>Weight Change</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="p : ${recentProgressList}">
                                <td class="fw-semibold" th:text="${p.name}"></td>

                                <td>
                            <span class="badge bg-secondary"
                                  th:text="${p.startWeight + ' kg'}">
                            </span>
                                </td>

                                <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${p.currentWeight + ' kg'}">
                            </span>
                                </td>

                                <td>
                            <span th:class="'badge ' +
                                (${p.weightChange > 0} ? 'bg-danger' :
                                (${p.weightChange < 0} ? 'bg-success' :
                                'bg-secondary'))"
                                  th:text="${(p.weightChange > 0 ? '+' : '')
                                            + p.weightChange + ' kg'}">
                            </span>
                                </td>
                            </tr>

                            <tr th:if="${recentProgressList.size()==0}">
                                <td colspan="4"
                                    class="text-center text-muted py-4">
                                    No progress yet
                                </td>
                            </tr>

                            </tbody>

                        </table>
                    </div>

                </div>
            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
