<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/trainer-sideber :: trainerSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">

        <div class="container-fluid py-4">

            <!-- Page Header -->
            <div class="mb-4">
                <h3 class="fw-bold">Member Details</h3>
                <p class="text-muted mb-0">Complete member profile and fitness information</p>
            </div>

            <div class="row justify-content-center">

                <div class="col-lg-9 col-md-11">

                    <div class="card shadow-sm border-0 rounded-4">

                        <div class="card-body p-4">

                            <div class="row g-4 align-items-center">

                                <!-- Profile -->
                                <div class="col-md-4 text-center">

                                    <img th:if="${member.user.profileImage != null}"
                                         th:src="@{'/uploads/profile/' + ${member.user.profileImage}}"
                                         class="rounded-circle shadow-sm"
                                         style="width:140px;height:140px;object-fit:cover">

                                    <img th:if="${member.user.profileImage == null}"
                                         src="/images/default-user.png"
                                         class="rounded-circle shadow-sm"
                                         style="width:140px;height:140px;object-fit:cover">

                                    <h5 class="mt-3 fw-semibold"
                                        th:text="${member.user.firstName + ' ' + member.user.lastName}">
                                    </h5>

                                    <span th:if="${member.active}"
                                          class="badge bg-success">
                                Active
                            </span>

                                    <span th:if="${!member.active}"
                                          class="badge bg-danger">
                                Expired
                            </span>

                                </div>


                                <!-- Member Information -->
                                <div class="col-md-8">

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Email</div>
                                        <div class="col-7" th:text="${member.user.email}"></div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Trainer</div>
                                        <div class="col-7"
                                             th:text="${member.trainer != null ? member.trainer.user.firstName : 'Not Assigned'}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Membership</div>
                                        <div class="col-7"
                                             th:text="${member.membership.name}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Start Date</div>
                                        <div class="col-7"
                                             th:text="${member.startDate}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">End Date</div>
                                        <div class="col-7"
                                             th:text="${member.endDate}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Height</div>
                                        <div class="col-7"
                                             th:text="${member.height + ' cm'}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Initial Weight</div>
                                        <div class="col-7"
                                             th:text="${member.initialWeight + ' kg'}">
                                        </div>
                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Due Amount</div>

                                        <div class="col-7">

                                    <span th:if="${member.dueAmount > 0}"
                                          class="badge bg-danger"
                                          th:text="${member.dueAmount + ' ৳'}">
                                    </span>

                                            <span th:if="${member.dueAmount == 0}"
                                                  class="badge bg-success">
                                        No Due
                                    </span>

                                        </div>

                                    </div>

                                    <div class="row mb-2">
                                        <div class="col-5 fw-semibold">Assigned Routine</div>

                                        <div class="col-7">

                                    <span th:if="${member.routineTemplate != null}"
                                          class="badge bg-info"
                                          th:text="${member.routineTemplate.name}">
                                    </span>

                                            <span th:if="${member.routineTemplate == null}"
                                                  class="text-muted">
                                        No Routine Assigned
                                    </span>

                                        </div>

                                    </div>

                                    <div class="row">
                                        <div class="col-5 fw-semibold">Joined At</div>
                                        <div class="col-7"
                                             th:text="${#temporals.format(member.createdAt,'dd MMM yyyy')}">
                                        </div>
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
