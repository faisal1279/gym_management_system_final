<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
    <style>
        .stat-card{
            border-radius:14px;
            transition:0.3s;
        }

        .stat-card:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .exercise-img-card img{
            transition:0.3s;
        }

        .exercise-img-card img:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container py-5">

            <!-- Header -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <h2 class="fw-bold mb-2" th:text="${exercise.name}"></h2>
                    <span class="badge bg-primary px-3 py-2">
                <i class="ri-bar-chart-line me-1"></i>
                <span th:text="${exercise.difficulty}"></span>
            </span>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-3 mb-5">
                <div class="col-md-3 col-6">
                    <div class="card border-0 shadow-sm text-center stat-card">
                        <div class="card-body">
                            <i class="ri-repeat-line fs-3 text-primary"></i>
                            <div class="text-muted small mt-2">Sets</div>
                            <h3 class="fw-bold" th:text="${sets}"></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="card border-0 shadow-sm text-center stat-card">
                        <div class="card-body">
                            <i class="ri-run-line fs-3 text-success"></i>
                            <div class="text-muted small mt-2">Reps</div>
                            <h3 class="fw-bold" th:text="${reps}"></h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Images -->
            <div class="mb-5">
                <h4 class="fw-semibold mb-3"><i class="ri-image-line me-1"></i>Exercise Images</h4>
                <div class="row g-3">
                    <div class="col-md-4 col-6" th:each="img : ${exercise.images}">
                        <div class="exercise-img-card">
                            <img th:src="@{'/uploads/exercises/' + ${img.imageUrl}}" class="img-fluid rounded shadow-sm">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Videos -->
            <div class="mb-5">
                <h4 class="fw-semibold mb-3"><i class="ri-video-line me-1"></i>Exercise Videos</h4>
                <div th:each="vid : ${videoUrls}" class="mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="ratio ratio-16x9">
<!--                                <iframe th:src="${vid}" allow="autoplay; encrypted-media" allowfullscreen></iframe>-->
                                <iframe
                                        th:src="'https://www.youtube.com/embed/' + ${#strings.substringBefore(#strings.substringAfter(vid,'youtu.be/'),'?')}"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen>
                                </iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="fw-semibold mb-3"><i class="ri-file-text-line me-1"></i>Description</h5>
                    <p class="text-muted mb-0" th:text="${exercise.description}"></p>
                </div>
            </div>

            <!-- Warning -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="fw-semibold text-danger mb-3"><i class="ri-alert-line me-1"></i>Warning</h5>
                    <p class="mb-0" th:text="${exercise.warning}"></p>
                </div>
            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
