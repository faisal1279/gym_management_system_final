<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">

            <h3 class="mb-3">
                <i class="ri-calendar-check-line"></i> My Attendance
            </h3>

            <!-- Month Filter -->
            <form method="get" class="mb-4 d-flex gap-2">
                <input type="month" name="month"
                       th:value="${month}"
                       class="form-control w-auto">
                <button class="btn btn-primary">Filter</button>
            </form>

            <!-- Monthly Percentage -->
            <div class="alert alert-info">
                <strong>Attendance Percentage:</strong>
                <span th:text="${#numbers.formatDecimal(percentage,1,2)}"></span>%
            </div>

            <!-- Attendance Table -->
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="a : ${attendanceList}">
                    <td th:text="${a.date}"></td>

                    <td>
                <span th:if="${a.present}"
                      class="badge bg-success">
                    Present
                </span>

                        <span th:if="${!a.present}"
                              class="badge bg-danger">
                    Absent
                </span>
                    </td>
                </tr>

                <tr th:if="${attendanceList.isEmpty()}">
                    <td colspan="2" class="text-center text-muted">
                        No attendance data found
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
