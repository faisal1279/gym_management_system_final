<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">
            <h3><i class="ri-id-card-line"></i> Membership Details</h3>
            <hr>
            <table class="table table-bordered">
                <tr>
                    <th>Membership Type</th>
                    <td th:text="${member.membership.name}"></td>
                </tr>
                <tr>
                    <th>Start Date</th>
                    <td th:text="${member.startDate}"></td>
                </tr>
                <tr>
                    <th>End Date</th>
                    <td th:text="${member.endDate}"></td>
                </tr>
                <tr>
                    <th>Remaining Days</th>
                    <td>
                <span th:if="${!expired}"
                      th:text="${daysLeft + ' days'}"></span>
                        <span th:if="${expired}"
                              class="text-danger">Expired</span>
                    </td>
                </tr>
                <tr>
                    <th>Status</th>
                    <td>
                <span th:if="${!expired}"
                      class="badge bg-success">Active</span>
                        <span th:if="${expired}"
                              class="badge bg-danger">Expired</span>
                    </td>
                </tr>
            </table>

            <button th:if="${expired}"
                    class="btn btn-warning">
                🔁 Request Renewal
            </button>

        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
