        <div class="container py-4">

            <!-- Page Title -->
            <div class="mb-4">
                <h2 class="fw-bold">My Workout Routine</h2>
                <p class="text-muted mb-0">Follow your assigned workout plan</p>
            </div>

            <!-- Error -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Routines -->
            <div th:each="routine : ${routines}" class="mb-5">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" th:text="${routine.template.name}"></h4>
                    <span class="badge bg-primary">
                Level: <span th:text="${routine.template.level}"></span>
            </span>
                </div>

                <!-- Calendar Table -->

                <div class="table-responsive">

                    <table class="table table-bordered routine-calendar text-center">

                        <!-- Day Header -->
                        <thead class="table-dark">
                        <tr>
                            <th th:each="day : ${routine.template.days}"
                                th:text="${day.day}">
                            </th>
                        </tr>
                        </thead>

                        <!-- Exercise Row -->
                        <tbody>
                        <tr>

                            <td th:each="day : ${routine.template.days}" class="calendar-cell">

                                <div th:each="ex : ${day.exercises}" class="exercise-item">

                                    <a th:href="@{/member/exercise/details/{id}(id=${ex.exercise.exerciseId}, sets=${ex.sets}, reps=${ex.reps})}"
                                       class="exercise-link"
                                       th:text="${ex.exercise.name}">
                                    </a>

                                </div>

                                <div th:if="${#lists.isEmpty(day.exercises)}"
                                     class="text-muted small">
                                    Rest
                                </div>

                            </td>

                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>
