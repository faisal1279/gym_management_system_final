<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">

            <!-- Page Title -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Member Dashboard</h2>
                <span class="text-muted">Overview</span>
            </div>

            <div class="row g-4">

                <!-- Profile Card -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-1" th:text="${data.fullName}"></h4>
                            <p class="text-muted mb-3" th:text="${data.email}"></p>

                            <span class="badge bg-success px-3 py-2"
                                  th:if="${data.daysLeft > 0}">
                    Active
                </span>

                            <span class="badge bg-danger px-3 py-2"
                                  th:if="${data.daysLeft == 0}">
                    Expired
                </span>

                            <hr class="my-4">

                            <p>Plan:
                                <strong th:text="${data.membershipName}"></strong>
                            </p>

                            <p>Valid Till:
                                <strong th:text="${data.endDate}"></strong>
                            </p>

                            <p>Days Left:
                                <strong th:text="${data.daysLeft}"></strong>
                            </p>

                        </div>
                    </div>
                </div>


                <!-- Payment Summary -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-body p-4">

                            <h5 class="fw-semibold mb-3">Payment Summary</h5>

                            <p>Total Paid:
                                ৳ <strong th:text="${data.totalPaid}"></strong>
                            </p>

                            <p>Due Amount:
                                ৳ <strong th:text="${data.dueAmount}"></strong>
                            </p>

                            <p>Last Payment:
                                <strong th:text="${data.lastPaymentDate}"></strong>
                            </p>

                        </div>
                    </div>
                </div>

            </div>


            <!-- Membership Progress -->
            <div class="card shadow-sm border-0 rounded-4 mt-4">
                <div class="card-body p-4">

                    <h5 class="fw-semibold mb-3">Membership Progress</h5>

                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-success"
                             role="progressbar"
                             th:style="'width:' + (${data.daysLeft} * 100 / 30) + '%'">
                        </div>
                    </div>

                </div>
            </div>


            <!-- Attendance Chart -->
            <div class="card shadow-sm border-0 rounded-4 mt-4">
                <div class="card-body p-4">
                    <h5 class="fw-semibold mb-3">Attendance Overview</h5>
                    <canvas id="attendanceChart"></canvas>
                </div>
            </div>



        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    new Chart(document.getElementById("attendanceChart"), {
        type: 'bar',
        data: {
            labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
            datasets: [{
                label: "Attendance",
                data: [1,1,0,1,1,0,1]
            }]
        }
    });
</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
