<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Dashboard Wrapper -->
<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/member-sideber :: memberSidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container mt-4">
            <h3><i class="ri-wallet-line"></i> Payment History</h3>
            <hr>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${payments}">
                    <td th:text="${p.paymentDate}"></td>
                    <td th:text="${p.amount}"></td>
                    <td th:text="${p.method}"></td>
                    <td>
                <span th:if="${p.success}"
                      class="badge bg-success">Paid</span>
                        <span th:if="${!p.success}"
                              class="badge bg-warning">Due</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <p th:if="${payments.isEmpty()}"
               class="text-muted">
                No payment records found.
            </p>
        </div>

    </main>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>

</body>
</html>
