<div class="container login-wrapper">



    <div class="login-box">

        <!-- Logout message -->
        <div th:if="${param.logout}" class="alert alert-success text-center">
            You have been logged out successfully
        </div>
        <div  th:if="${error}" th:text="${error}" class="alert alert-danger text-center">
        </div>

        <!-- Header -->
        <div class="login-header d-flex justify-content-between">
            <h3>LOGIN</h3>
            <a th:href="@{/register}" class="register-link">Register</a>
        </div>

        <form th:action="@{/login}" method="post">

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Username or email address *</label>
                <input type="text" class="form-control" name="email" required>
            </div>

            <!-- Password -->
            <div class="mb-3 password-field">
                <label class="form-label">Password *</label>

                <div class="password-wrapper">
                    <input type="password" class="form-control" name="password" id="password" required>

                    <i class="ri-eye-line toggle-password" onclick="togglePassword()"></i>
                </div>
            </div>

            <!-- Remember -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember">
                <label class="form-check-label">
                    Remember me
                </label>
            </div>

            <!-- Button -->
            <button type="submit" class="btn login-btn">
                LOG IN
            </button>

            <!-- Lost password -->
            <p class="lost-password">
                <a href="#">Lost your password?</a>
            </p>

        </form>

    </div>

</div>

<!--Footer-->
<div th:replace="fragments/footer :: footer"></div>
<script>
    function togglePassword(){

        const password = document.getElementById("password");
        const icon = document.querySelector(".toggle-password");

        if(password.type === "password"){
            password.type = "text";
            icon.classList.remove("ri-eye-line");
            icon.classList.add("ri-eye-off-line");
        }else{
            password.type = "password";
            icon.classList.remove("ri-eye-off-line");
            icon.classList.add("ri-eye-line");
        }

    }
</script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/logout.js}"></script>
